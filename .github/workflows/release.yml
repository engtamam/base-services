# =============================================================================
# base-services — RELEASE
#
# Triggered by a version tag (v1.2.3). Publishes THREE things, in this order,
# and refuses to publish any of them if the gates are red:
#
#   1. container images   one per service, pushed to GHCR **by digest**
#   2. pinned values      deploy/services/*.values.yaml rewritten with those
#                         digests, and PROVEN to render against the chart
#   3. a GitHub Release   with the pinned values + checksums attached
#
# Why digests. The chart refuses an unpinned image: `:latest` with
# imagePullPolicy: IfNotPresent silently redeploys whatever is already on the
# node. A release is not "images were pushed" — it is "these exact digests, and
# the chart renders with them". `pin_digests.py --verify` is the gate.
#
# PRIVATE BY DEFAULT. The images inherit the repository's visibility. If the
# repo is private, so are the packages. Do not flip a package to public unless
# you intend to give the code away — the LICENSE grants nobody any rights.
# =============================================================================
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write        # create the GitHub Release
  packages: write        # push to GHCR
  id-token: write        # provenance attestation
  attestations: write
  # READ THE CI RUN FOR THIS COMMIT. An explicit `permissions:` block sets everything it does NOT
  # list to `none`, so the token could not read /actions/runs and verify-ci-green got a 403.
  #
  # It failed CLOSED — nothing published on a check it could not perform, and `a release must
  # actually publish` went red. That is the correct outcome and the reason both guards exist: a
  # release that cannot PROVE the commit was green must not ship it.
  actions: read

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io

  # HOW A RELEASE SATISFIES ITSELF THAT THE GATES ARE GREEN.
  #
  #   verify  (default) ASSERT, via the API, that the `ci` run for THIS EXACT COMMIT concluded
  #           success — and FAIL if it did not. release.sh already refuses to tag an unproven
  #           commit, so the tag can only exist on a commit CI has proved. Re-deriving that fact
  #           costs ~9 minutes and proves nothing new. Seconds instead.
  #   rerun   run every gate again from scratch (the repo-wide gates + a 17-way per-service
  #           matrix). Slower, and it trusts nothing at all.
  #   both    verify AND rerun. The belt-and-braces default for a nervous release.
  #
  # WHY THIS IS SAFE, AND WHY v0.2.0 WAS NOT. v0.2.0 "trusted CI" by SKIPPING the gate job — and
  # GitHub propagates a skip transitively, so `images` skipped, `publish` skipped, and a skipped
  # job does not fail a run. It shipped nothing and reported success.
  #
  # The difference is not the trust. It is that `verify` FAILS when CI was not green, and a
  # failure blocks everything downstream, where a skip did not. Downstream jobs below check the
  # result EXPLICITLY (`success` or `skipped`), so a disabled re-run can never be mistaken for a
  # passed one.
  #
  # SET IT AS A REPOSITORY VARIABLE, not here: a job-level `if:` cannot read `env`, only `vars`.
  #
  #     gh variable set RELEASE_GATE_MODE --body both      # re-prove everything as well
  #     gh variable set RELEASE_GATE_MODE --body rerun     # re-prove everything, only
  #     gh variable delete RELEASE_GATE_MODE               # back to the default: verify
  #
  # UNSET is the default, and the default is `verify` — the fast path, and the safe one: the tag
  # cannot exist on a commit CI did not prove, and verify-ci-green FAILS if it somehow does. The
  # matrix stays in the file, switchable back on from one variable the day it earns its keep.

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # PROVE THE COMMIT WAS GREEN — in seconds, not minutes.
  #
  # `release.sh` already refuses to tag a commit CI has not proved. This asserts that
  # independently, at release time, from the API: the `ci` run for THIS EXACT SHA must have
  # concluded `success`. If it did not, this job FAILS — and a failure blocks everything
  # downstream. (v0.2.0's mistake was expressing the same trust as a SKIP, which does not.)
  # ───────────────────────────────────────────────────────────────────────────
  verify-ci-green:
    name: ci was green for this commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The ci run for this SHA must have concluded success
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          echo "commit under release: $SHA"
          runs=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$SHA&per_page=50"                    --jq '[.workflow_runs[] | select(.name=="ci")]')
          count=$(echo "$runs" | jq 'length')
          if [ "$count" = "0" ]; then
            echo "::error::no ci run exists for $SHA. A tag must sit on a commit CI has PROVED."
            exit 1
          fi
          status=$(echo "$runs" | jq -r '.[0].status')
          concl=$(echo "$runs" | jq -r '.[0].conclusion')
          echo "ci: status=$status conclusion=$concl"
          if [ "$status" != "completed" ] || [ "$concl" != "success" ]; then
            echo "::error::ci for $SHA is '$status/$concl', not a completed success."
            echo "::error::Refusing to release a commit that has not been proved green."
            exit 1
          fi
          echo "ci was green for $SHA — the gates already ran on this exact tree."

  # ───────────────────────────────────────────────────────────────────────────
  # A release must never ship code the merge gates would have blocked.
  #
  # These ALWAYS run. We tried trusting a green CI run for the same commit to save ~9
  # minutes; it worked, and then GitHub propagated the resulting `skipped` transitively
  # and v0.2.0 published NOTHING while reporting success. The saving was not worth a
  # release that can silently ship nothing. A tag proves itself, every time.
  # ───────────────────────────────────────────────────────────────────────────
  gates:
    name: gates must be green
    # Only when the mode asks for a re-run. When it does not, this job is SKIPPED — and the
    # downstream `if:` treats a skip as acceptable ONLY because it also treats a FAILURE as fatal.
    # That explicitness is the whole lesson of v0.2.0.
    if: ${{ vars.RELEASE_GATE_MODE == 'rerun' || vars.RELEASE_GATE_MODE == 'both' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATASTORE_TEST_DSN: postgresql://ci:ci@127.0.0.1:5432/ci_test
      # The release runs the SAME gates as ci, so it needs the SAME real infra. It runs them
      # --strict, where a SKIPPED gate is a FAILED gate — so a missing MinIO does not quietly
      # degrade the release, it stops it. (It did: v0.4.2's gates failed here, `images` and
      # `publish` skipped, and `a release must actually publish` went red. The guard worked.)
      OBJECTSTORE_TEST_ENDPOINT: http://127.0.0.1:9000
      OBJECTSTORE_TEST_BUCKET: contract
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            services/*/pyproject.toml
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin
      - name: Start MinIO (the ObjectStore contract runs against a REAL S3-compatible server)
        run: |
          docker run -d --name minio -p 9000:9000             -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin             "$MINIO_IMAGE" server /data
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live; then echo "minio ready"; exit 0; fi
            sleep 2
          done
          echo "::error::MinIO never became healthy"; docker logs minio; exit 1
        env:
          MINIO_IMAGE: "minio/minio:RELEASE.2025-04-22T22-12-26Z"

      - name: Install every service
        run: |
          python -m pip install --upgrade pip
          # jsonschema: safety:product runs --strict, where a missing schema validator
          # is a FAILURE, not a skipped note. It arrived transitively before; a gate
          # must not depend on another package's dependency tree.
          pip install pytest pyyaml asyncpg jsonschema
          for d in services/*/; do pip install -e "$d[dev,ci,s3]" -q; done
      # --profile aggregate drops the three PER-SERVICE gates (suites, security-gate,
      # contracts:postgres). They are NOT skipped — they run in the `gates-matrix` job below, 17
      # of them at once, which is exactly how ci runs them. Running them serially here cost 9 of
      # this job's 10 minutes and proved nothing extra.
      #
      # `--strict` still means a SKIPPED gate is a FAILED gate. We are parallelising the gates,
      # not trusting anyone that they passed.
      - name: run_all_gates.sh --strict (repo-wide gates)
        run: bash tools/ci/run_all_gates.sh --strict --profile aggregate

  # ───────────────────────────────────────────────────────────────────────────
  # The PER-SERVICE gates, 17 at once. Same gates, same --strict, one job each —
  # a release must run them, but it need not run them one after another.
  # ───────────────────────────────────────────────────────────────────────────
  gates-matrix:
    name: gates ${{ matrix.service }}
    # The per-service gates, 17 at once. Kept so a release CAN re-prove everything from scratch —
    # and switchable off from one repo variable the day it earns nothing.
    if: ${{ vars.RELEASE_GATE_MODE == 'rerun' || vars.RELEASE_GATE_MODE == 'both' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - analytics-service
          - api-gateway
          - audit-service
          - authz-service
          - billing-service
          - compliance-service
          - connector-service
          - feature-flag-service
          - file-service
          - identity-service
          - job-service
          - notification-service
          - search-service
          - tenant-service
          - wallet-service
          - webhook-service
          - zatca-service
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATASTORE_TEST_DSN: postgresql://ci:ci@127.0.0.1:5432/ci_test
      OBJECTSTORE_TEST_ENDPOINT: http://127.0.0.1:9000
      OBJECTSTORE_TEST_BUCKET: contract
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      MINIO_IMAGE: "minio/minio:RELEASE.2025-04-22T22-12-26Z"
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000             -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin             "$MINIO_IMAGE" server /data
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live; then echo ready; exit 0; fi
            sleep 2
          done
          echo "::error::MinIO never became healthy"; docker logs minio; exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/*/pyproject.toml
      - name: Install ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ci,s3]"
      - name: suites + security-gate + contracts (strict)
        env:
          GATE_ONLY_UNIT: ${{ matrix.service }}
        run: |
          bash tools/ci/run_all_gates.sh --strict             --only suites --only security-gate --only contracts:postgres

  discover:
    name: discover services
    needs: [verify-ci-green, gates, gates-matrix]
    # EXPLICIT, because GitHub's default is the trap: a `needs` job that SKIPS skips its dependents
    # too, silently, and a skipped job does not fail a run. That is precisely how v0.2.0 published
    # nothing and called it success.
    #
    # So: verify-ci-green MUST have succeeded. The two re-run jobs may be `skipped` (the mode
    # turned them off) or `success` — but never `failure` or `cancelled`.
    if: >-
      always() &&
      needs.verify-ci-green.result == 'success' &&
      (needs.gates.result == 'success' || needs.gates.result == 'skipped') &&
      (needs.gates-matrix.result == 'success' || needs.gates-matrix.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.find.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          # `_template` carries a Dockerfile (it is the copy-me seed) but is NOT a service:
          # it has no deploy values file, so publishing an image for it would leak the seed
          # as a package AND fail the pinning step. A release publishes only what deploys.
          svcs=$(find services -maxdepth 2 -name Dockerfile -printf '%h\n' \
                 | sed 's|^services/||' \
                 | grep -v '^_template$' \
                 | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "services=$svcs" >> "$GITHUB_OUTPUT"
          echo "Discovered: $svcs"

          # Fail fast: every publishable service must have a values file to pin into.
          for s in $(echo "$svcs" | jq -r '.[]'); do
            if [ ! -f "deploy/services/$s.values.yaml" ]; then
              echo "::error::$s has a Dockerfile but no deploy/services/$s.values.yaml"
              exit 1
            fi
          done

  # ───────────────────────────────────────────────────────────────────────────
  # IMAGES — one job per service. Each emits its digest as an artifact so the
  # pinning job can assemble them. The digest is what a deployment consumes;
  # the tag is only a human label.
  # ───────────────────────────────────────────────────────────────────────────
  images:
    name: image ${{ matrix.service }}
    needs: discover
    # EXPLICIT, for the same reason `discover` is — and this is where the lesson had to be learned
    # TWICE. A job with no `if:` defaults to `success()`, and GitHub evaluates that across the whole
    # ANCESTOR CHAIN, not just its direct `needs`. `gates` is an ancestor of `images` through
    # `discover`; when the mode skipped it, `images` skipped too — even though `discover` succeeded
    # and printed all 17 services.
    #
    # A skip is not a failure, so nothing went red until `a release must actually publish` did. That
    # guard is the only reason this was caught instead of shipping an empty release for the second
    # time. Every job downstream of an optional one now states its condition OUT LOUD.
    if: >-
      always() &&
      needs.discover.result == 'success' &&
      needs.discover.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.discover.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${ref}" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (by digest)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.v.outputs.owner }}/${{ matrix.service }}:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=Proprietary
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Signed, verifiable proof that THIS digest was built from THIS commit by
      # this workflow. Without it a digest is just a number someone typed.
      #
      # BEST-EFFORT ON A PRIVATE REPO. GitHub's attestation API refuses user-owned PRIVATE
      # repositories ("Feature not available ... make this repository public"). Our standing
      # rule is that this repo stays private — a public image ships your source in its layers,
      # and a public repo hands over the source outright. So the private rule wins: attestation
      # is attempted and, if the platform refuses, the release proceeds without it. The instant
      # the repo (or an org migration) makes this available, it starts working with no change
      # here. The CVE scan below is NOT best-effort — a vulnerable image is never released.
      - name: Attest build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.v.outputs.owner }}/${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Scan the PUBLISHED image with a trivy WE install, not aquasecurity/trivy-action.
      # That action failed here at its own binary install ("found version 0.65.0" -> exit 1),
      # before scanning anything -- a flaky external action, the same class of problem as the
      # nonexistent action ref that killed v0.1.1. The curl installer below is the one the gates
      # job already uses successfully. A real HIGH/CRITICAL still blocks the release
      # (a vulnerable image is not published); a scanner that cannot run is not a finding.
      - name: Scan the published image (CVE gate)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.v.outputs.owner }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin
          # GHCR is eventually consistent: build-push returns a digest the instant the write is
          # ACCEPTED, but a read of that manifest from a scanner can briefly 404 (MANIFEST_UNKNOWN)
          # until it propagates across registry nodes. trivy does NOT retry that transient — it exits
          # FATAL, and a fail-fast:false rerun re-hits the same gha-cache timing, so one service can
          # fail the release deterministically for a reason that is not a vulnerability. So WAIT for
          # the manifest to be resolvable FIRST (docker/login-action already authenticated us), then
          # run trivy ONCE as the authoritative CVE gate — separating "is it propagated" (retryable
          # infra) from "is it vulnerable" (a real finding that must still block).
          for i in $(seq 1 12); do
            if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
              echo "manifest resolvable after ${i} attempt(s)"; break
            fi
            if [ "$i" = "12" ]; then
              echo "::error::$IMAGE did not become resolvable on GHCR after propagation wait"; exit 1
            fi
            echo "manifest not yet propagated (attempt ${i}); waiting 5s"; sleep 5
          done
          # trivy reads ~/.docker/config.json for the same GHCR credentials.
          trivy image --quiet --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 "$IMAGE"

      - name: Record the digest
        run: |
          mkdir -p digests
          printf '%s' '${{ steps.build.outputs.digest }}' > "digests/${{ matrix.service }}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.service }}
          path: digests/${{ matrix.service }}
          retention-days: 1

  # ───────────────────────────────────────────────────────────────────────────
  # PIN — turn the digests into deployable values, and PROVE they render.
  # ───────────────────────────────────────────────────────────────────────────
  publish:
    name: pin digests + publish release
    needs: [discover, images]
    # Same trap, same explicit answer: `images` must have SUCCEEDED — not merely "not failed".
    if: >-
      always() &&
      needs.discover.result == 'success' &&
      needs.images.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            services/*/pyproject.toml
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Assemble the digest map
        id: map
        run: |
          python - <<'PY'
          import json, pathlib
          out = {p.name: p.read_text().strip() for p in pathlib.Path("digests").iterdir() if p.is_file()}
          pathlib.Path("digests.json").write_text(json.dumps(out, indent=2))
          print(json.dumps(out, indent=2))
          PY
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Pin the digests into deploy values
        run: |
          python tools/release/pin_digests.py \
            --digests digests.json \
            --registry ${{ env.REGISTRY }}/${{ steps.map.outputs.owner }} \
            --out deploy/pinned

      - name: Verify NOTHING is left unpinned
        run: python tools/release/pin_digests.py --verify deploy/pinned

      - name: Prove the chart renders with the REAL digests
        run: |
          set -e
          for f in deploy/pinned/*.values.yaml; do
            n=$(basename "$f" .values.yaml)
            helm template "$n" deploy/chart -f "$f" > /dev/null
            echo "  renders: $n"
          done

      - name: Package the release artifact
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          cp LICENSE deploy/pinned/LICENSE
          tar -czf "deploy-pinned-${ref}.tar.gz" -C deploy pinned chart
          sha256sum "deploy-pinned-${ref}.tar.gz" digests.json > checksums.txt
          cat checksums.txt

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            deploy-pinned-*.tar.gz
            digests.json
            checksums.txt
          body: |
            **Proprietary software. All rights reserved. See LICENSE — no licence is granted.**

            Container images (GHCR, private unless the repository is public):
            `${{ env.REGISTRY }}/${{ steps.map.outputs.owner }}/<service>@<digest>`

            `deploy-pinned-*.tar.gz` contains the chart and the values files pinned to the
            exact digests published by this release. Deploy with:

            ```bash
            tar xzf deploy-pinned-*.tar.gz
            helm upgrade --install wallet-service ./chart -f pinned/wallet-service.values.yaml
            ```

            Every digest carries a signed build-provenance attestation. Verify with:

            ```bash
            gh attestation verify oci://${{ env.REGISTRY }}/${{ steps.map.outputs.owner }}/wallet-service@<digest> \
              --repo ${{ github.repository }}
            ```

  # ───────────────────────────────────────────────────────────────────────────
  # A RELEASE THAT PUBLISHED NOTHING IS NOT A SUCCESSFUL RELEASE.
  #
  # v0.2.0 reported SUCCESS having built zero images: `gates` was skipped (correctly —
  # CI had already proved the commit), GitHub propagated that skip transitively, and
  # every downstream job skipped. A skipped job does not fail a run, so the whole
  # release went green having done nothing at all.
  #
  # It is the same defect the gate runner had: a loop over an empty set passes, loudly,
  # in green. The fix is the same: make the empty case FATAL and say so out loud.
  # ───────────────────────────────────────────────────────────────────────────
  verify-published:
    name: a release must actually publish
    needs: [discover, images, publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a release that shipped nothing
        run: |
          echo "discover: ${{ needs.discover.result }}"
          echo "images:   ${{ needs.images.result }}"
          echo "publish:  ${{ needs.publish.result }}"
          if [ "${{ needs.images.result }}" != "success" ]              || [ "${{ needs.publish.result }}" != "success" ]; then
            echo "::error::This tag published NO images. A skipped job does not fail a run, so the"
            echo "::error::release would otherwise have reported success having done nothing."
            exit 1
          fi
          echo "images built and release published."
