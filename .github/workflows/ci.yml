# =============================================================================
# base-services — MONOREPO CI
#
# SINGLE SOURCE OF TRUTH: tools/ci/run_all_gates.sh. This workflow installs the
# infra the script would otherwise skip (postgres, helm, trivy) and then runs it
# with --strict, where a SKIPPED gate is a FAILED gate. That is the whole trick:
# "we installed the database" becomes something CI PROVES, not something a YAML
# comment asserts. `safety:ci-parity` keeps this file and that script in step.
#
# Run any of it locally, before pushing — local == CI:
#     tools/ci/run_all_gates.sh              # everything runnable here
#     tools/ci/run_all_gates.sh --list       # what each gate protects
#     tools/ci/run_all_gates.sh --profile quick
#
# Each service is self-contained, so each is built and checked independently.
# Services are DISCOVERED, never listed: a new service is gated the day it lands.
# =============================================================================
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"          # a dict-ordering bug must not hide behind luck
  PYTHON_VERSION: "3.12"
  # S3-compatible server the ObjectStore contract runs against. PINNED: `latest` moves, and a
  # release that cannot be rebuilt byte-for-byte is not a release.
  MINIO_IMAGE: "minio/minio:RELEASE.2025-04-22T22-12-26Z"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # META — the gates that keep the other gates honest. Seconds, not minutes.
  # ───────────────────────────────────────────────────────────────────────────
  meta:
    name: meta-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the secret guard needs a merge-base
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            services/*/pyproject.toml

      - name: Install meta-gate deps
        run: python -m pip install --upgrade pip pyyaml

      - name: safety:secrets — no credential material in the diff
        run: bash tools/ci/run_all_gates.sh --only safety:secrets

      # gates: safety:runner
      - name: "safety:runner — the gate runner's own guards, plus scripts/tests"
        run: |
          python -m pip install --quiet pytest jsonschema
          bash tools/ci/run_all_gates.sh --only safety:runner

      # A gate that cannot fail is decoration, and gates.d makes decoration cheap.
      # Reports which gates have proven they can fail. Does not block: a missing
      # selftest is a debt, not a defect.
      - name: "prove the gates can fail (--verify)"
        continue-on-error: true
        run: bash tools/ci/run_all_gates.sh --verify

      # gates: safety:dockerfiles
      - name: "safety:dockerfiles — every service builds the context it COPYs"
        run: python tools/ci/check_dockerfiles.py

      # gates: safety:image-runtime
      - name: "safety:image-runtime — the image can run the config its values ship"
        run: python tools/ci/check_image_runtime.py

      # gates: safety:pii
      - name: "safety:pii — a service that holds a person can erase them"
        run: python tools/ci/check_pii.py

      # gates: safety:own-license
      - name: "safety:own-license — the product is proprietary; only its dependencies are permissive"
        run: python tools/ci/check_own_license.py

      # gates: safety:edge
      - name: "safety:edge — the edge terminates TLS for every request; a mistake is an open door"
        run: python tools/ci/check_edge.py

      # gates: safety:admin
      - name: "safety:admin — the admin panel is a map, never the authority"
        run: python tools/ci/check_admin.py

      # gates: safety:user-actions
      - name: "safety:user-actions — the end-user app catalog is a map, never the authority"
        run: python tools/ci/check_user_actions.py

      # gates: safety:action-coverage
      - name: "safety:action-coverage — every user-tier route is declared, or excluded with a reason"
        run: python tools/ci/check_action_coverage.py

      # gates: safety:privacy-wiring
      - name: "safety:privacy-wiring — every service that can erase is a dispatch target"
        run: python tools/ci/check_privacy_wiring.py

      # gates: safety:dead-code
      - name: "safety:dead-code — no orphaned imports, functions or properties"
        run: python tools/ci/check_dead_code.py

      # gates: safety:openapi
      - name: "safety:openapi — published specs are generated, not hand-written"
        run: python tools/ci/gen_openapi.py --check

      # gates: safety:audit-wiring
      - name: "safety:audit-wiring — every service can prove what it did"
        run: |
          python tools/ci/selftest_audit_wiring.py
          python tools/ci/check_audit_wiring.py

      # gates: safety:tenancy
      - name: "safety:tenancy — a token carries exactly ONE tenant, and only one it is entitled to"
        run: python tools/ci/check_tenancy.py

      # gates: safety:actions
      - name: "safety:actions — every action a workflow uses actually exists"
        run: python tools/ci/check_action_refs.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # gates: safety:ci-parity
      - name: safety:ci-parity — this workflow runs exactly the gates the script defines
        run: python tools/ci/check_ci_parity.py

      # gates: coverage:services
      - name: coverage:services — every service carries the guards we require
        run: python tools/ci/check_service_coverage.py

      # gates: safety:scans
      - name: "safety:scans — no unexplained full-collection read on a request path"
        run: python tools/ci/check_scan_discipline.py

      # gates: safety:product
      - name: "safety:product — product identity valid; frozen identifiers unmoved"
        run: |
          python -m pip install --quiet jsonschema pytest
          python -m pytest -q scripts/tests/test_product_config.py
          python scripts/check_product_config.py --strict

      # gates: safety:wiring
      - name: "safety:wiring — product identity reaches a real Settings field"
        run: python tools/ci/check_product_wiring.py

  # ───────────────────────────────────────────────────────────────────────────
  # SUITES — one job per DISCOVERED service, each against a REAL postgres.
  # The in-memory adapter's asyncio.Lock hides every race a database has to
  # serialise itself, so `incr_if_below` and `cas` can only be proven here.
  # ───────────────────────────────────────────────────────────────────────────
  discover:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.find.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # change detection needs the base commit reachable
      - id: find
        name: Discover changed services
        run: |
          # Only rebuild/retest what a change actually affects. A change confined to one
          # service selects only it; a change to the chart, tools/, a workflow, the _template
          # seed, or a root file selects EVERY service. When the base cannot be resolved, the
          # answer is every service — the default is never "skip". See changed_services.py.
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          elif [ -n "${{ github.event.before }}" ] && \
               [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ]; then
            svcs=$(python tools/ci/changed_services.py --base HEAD --all-if-empty)
          else
            svcs=$(python tools/ci/changed_services.py --base "$base")
          fi
          echo "services=$svcs" >> "$GITHUB_OUTPUT"
          echo "Selected: $svcs"

  test-and-gate:
    name: ${{ matrix.service }}
    needs: discover
    if: needs.discover.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.discover.outputs.services) }}

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATASTORE_TEST_DSN: postgresql://ci:ci@127.0.0.1:5432/ci_test
      # The s3 adapter is held to the ObjectStore contract against a REAL S3-compatible server.
      OBJECTSTORE_TEST_ENDPOINT: http://127.0.0.1:9000
      OBJECTSTORE_TEST_BUCKET: contract
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      # MinIO speaks the S3 API, so it exercises the SAME s3 adapter that holds customer files in
      # production. Without it the s3 contract param SKIPS — and contracts:postgres fails on a
      # skip, correctly: an adapter nobody tested is an adapter nobody has proved.
      #
      # Started as a STEP, not a `services:` container, because a service container has no
      # `command:` key and `minio/minio` needs `server /data` as an argument — it would exit at
      # once. The image is PINNED: `latest` is a moving target and a release must be reproducible.
      - name: Start MinIO (S3-compatible, for the ObjectStore contract)
        run: |
          docker run -d --name minio -p 9000:9000             -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin             ${{ env.MINIO_IMAGE }} server /data
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live; then echo "minio ready"; exit 0; fi
            sleep 2
          done
          echo "::error::MinIO never became healthy"; docker logs minio; exit 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            services/*/pyproject.toml

      - name: Install (runtime + dev + ci)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ci,s3]"   # s3: the ObjectStore contract runs against a REAL MinIO
          pip install asyncpg      # the postgres extra: the contract must run for real

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      # gates: suites
      - name: suites — pytest
        run: python -m pytest -q -p no:cacheprovider

      # gates: contracts:postgres
      - name: contracts:postgres — and PROVE the postgres params were not skipped
        run: |
          if [ ! -f tests/contracts/test_datastore_contract.py ]; then
            echo "no datastore contract in this service"; exit 0
          fi
          out=$(python -m pytest tests/contracts/ -q -p no:cacheprovider 2>&1 | tail -3)
          echo "$out"
          if echo "$out" | grep -qi "skipped"; then
            echo "::error::a contract param was SKIPPED — the real-infra DSN/endpoint never reached the tests"
            exit 1
          fi

      # gates: security-gate
      - name: "security-gate — licenses / SAST / secrets / CVEs (strict: no skips)"
        run: python ci/security_gate.py --strict

  # ───────────────────────────────────────────────────────────────────────────
  # CHART — the deploy chart must refuse to render a mistake, and must render
  # the same bytes twice with no cluster reachable.
  # ───────────────────────────────────────────────────────────────────────────
  chart:
    name: chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            services/*/pyproject.toml
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: chart:guards — the chart refuses to render a mistake
        run: bash tools/ci/run_all_gates.sh --only chart:guards

      - name: chart:render — every service's values renders
        run: bash tools/ci/run_all_gates.sh --only chart:render

      - name: determinism — helm template is byte-identical and needs no cluster
        run: bash tools/ci/run_all_gates.sh --only determinism

  # ───────────────────────────────────────────────────────────────────────────
  # GATES — the strict run, and the job that blocks the merge. A gate whose
  # infra is missing FAILS here rather than skipping, so a green badge means
  # every wired gate actually executed.
  # ───────────────────────────────────────────────────────────────────────────
  gates:
    name: run_all_gates.sh --strict (merge blocker)
    needs: [meta, test-and-gate, chart]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATASTORE_TEST_DSN: postgresql://ci:ci@127.0.0.1:5432/ci_test
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            services/*/pyproject.toml
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Install every service (self-contained, so each installs itself)
        run: |
          python -m pip install --upgrade pip
          # jsonschema: safety:product runs --strict, where a missing schema validator
          # is a FAILURE, not a skipped note. It arrived transitively before; a gate
          # must not depend on another package's dependency tree.
          pip install pytest pyyaml asyncpg jsonschema
          for d in services/*/; do
            pip install -e "$d[dev,ci,s3]" -q
          done

      - name: Show what each gate protects
        run: bash tools/ci/run_all_gates.sh --list

      - name: run_all_gates.sh --strict
        run: bash tools/ci/run_all_gates.sh --strict --profile aggregate
