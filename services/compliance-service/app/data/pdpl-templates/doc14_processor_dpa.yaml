- section:
    level: 9
    text:
      en: Annex B — Security Measures
      ar: الملحق ب — التدابير الأمنية
- lead:
    text:
      en: The Processor applies at least the following, proportionate to the sensitivity and amount of data
        (Law Art. 19). Amend to reflect the measures actually in place.
      ar: يطبّق المعالِج ما لا يقلّ عمّا يلي، بما يتناسب مع حساسية البيانات وكميتها (النظام م.19). عدّلها
        لتعكس التدابير المطبَّقة فعلاً.
- table:
    headers:
    - en: Measure
      ar: التدبير
    - en: Description
      ar: الوصف
    rows:
    - - en: Encryption in transit
        ar: التشفير أثناء النقل
      - en: Personal Data is encrypted while transmitted over networks.
        ar: تُشفَّر البيانات الشخصية أثناء نقلها عبر الشبكات.
    - - en: Access control (least privilege)
        ar: ضبط الوصول (أقل الصلاحيات)
      - en: Access is role-based and limited to personnel who need it, with authentication and audit logging.
        ar: الوصول قائم على الأدوار ومحصور بمن يحتاجه، مع مصادقة وتسجيل تدقيقي.
    - - en: Pseudonymization / minimization
        ar: الترميز / التقليل
      - en: Identifiers are minimized or pseudonymized where the purpose allows.
        ar: تُقلَّل المُعرِّفات أو تُرمَّز بأسماء مستعارة حيثما سمح الغرض.
    - - en: Monitoring & breach response
        ar: المراقبة والاستجابة للانتهاك
      - en: Logs are monitored, and a breach is detected, contained and notified to the Controller without
          undue delay.
        ar: تُراقَب السجلات، ويُكتشَف الانتهاك ويُحتوى ويُبلَّغ للمتحكم دون تأخير غير مبرر.
    - - en: Secure retention & destruction
        ar: الاحتفاظ والإتلاف الآمن
      - en: Data is retained only as long as needed and destroyed so it cannot be viewed or recovered.
        ar: تُحفَظ البيانات بقدر الحاجة فقط وتُتلَف بحيث لا يمكن الاطلاع عليها أو استعادتها.
    widths:
