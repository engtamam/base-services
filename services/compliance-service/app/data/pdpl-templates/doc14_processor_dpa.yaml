- cover:
    title:
      en: Data Processing Agreement — Processor's Commitments
      ar: اتفاقية معالجة البيانات — التزامات المعالِج
    subtitle:
      en: Personal Data Protection Law (PDPL) — Kingdom of Saudi Arabia
      ar: نظام حماية البيانات الشخصية — المملكة العربية السعودية
- snapshot:
    rows:
    - - en: Processor
        ar: المعالِج
