- helper:
    text:
      en: Complete one form per high-risk activity. Duplicate this block as needed. Replace each [SQUARE
        BRACKET] with your value; delete the red (guidance) notes.
      ar: استكمل نموذجاً واحداً لكل نشاط عالي الخطورة. كرّر هذا القالب حسب الحاجة. استبدل كل [قوس مربّع]
        بقيمتك؛ واحذف الملاحظات الحمراء (الإرشادية).
- fields:
    rows:
    - - en: Activity name / reference
        ar: اسم النشاط / المرجع
      - '[ACTIVITY]'
      - en: e.g. "Face-recognition login — BIO-01"
        ar: مثل "الدخول بالتعرف على الوجه — BIO-01"
    - - en: Owner / assessor
        ar: المالك / المُقيّم
      - '[OWNER]'
      - en: team + person running the assessment
        ar: الفريق + الشخص المُجري للتقييم
    - - en: Purpose & legal basis
        ar: الغرض والأساس النظامي
      - '[PURPOSE + LEGAL_BASIS]'
      - en: 'basis: Consent / Contract / Legal obligation / Legitimate interest'
        ar: 'الأساس: الموافقة / التعاقد / التزام نظامي / مصلحة مشروعة'
    - - en: Nature, types, sources & recipients
        ar: طبيعة البيانات وأنواعها ومصادرها والمستقبِلون
      - '[DATA_DETAILS]'
      - en: e.g. biometric templates, collected from users, shared with auth provider
        ar: 'مثل: بصمات حيوية، تُجمع من المستخدمين، تُشارك مع مزود المصادقة'
    - - en: Scope & geographic scope
        ar: النطاق والنطاق الجغرافي
      - '[SCOPE]'
      - en: how many people; where processed/stored — inside/outside KSA
        ar: عدد الأشخاص؛ مكان المعالجة/التخزين — داخل/خارج المملكة
    - - en: Context & relationships
        ar: السياق والعلاقات
      - '[CONTEXT]'
      - en: relationship to data subjects, e.g. customers, employees; any imbalance
        ar: العلاقة بأصحاب البيانات، مثل العملاء أو الموظفين؛ وأي اختلال في التوازن
    - - en: Necessity, proportionality & minimization
        ar: الضرورة والتناسب وتقليل البيانات
      - '[NECESSITY]'
      - en: is it needed? any less-intrusive way? is data minimized?
        ar: هل هو ضروري؟ هل توجد وسيلة أقل تدخلاً؟ هل قُلِّلت البيانات؟
    - - en: Date assessed / next review
        ar: تاريخ التقييم / المراجعة التالية
      - '[DATE]'
      - en: format YYYY-MM-DD
        ar: الصيغة سنة-شهر-يوم
