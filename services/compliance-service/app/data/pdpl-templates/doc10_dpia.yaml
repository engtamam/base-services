      ar: النتيجة، نسخة المعالج، وإعادة التقييم
- bullets:
    items:
    - - ''
      - en: 'Decision: ☐ Proceed  ☐ Proceed with the mitigations above  ☐ Do not proceed.'
        ar: 'القرار: ☐ المتابعة  ☐ المتابعة مع تطبيق إجراءات الحد أعلاه  ☐ عدم المتابعة.'
    - - ''
      - en: We provide a copy of this assessment to every Processor acting on our behalf in relation to
          the processing it covers. (Reg. Art. 25-3)
        ar: نُسلّم نسخة من هذا التقييم إلى كل جهة معالجة تعمل نيابةً عنا في المعالجة التي يتناولها. (اللائحة
          م.25-3)
    - - ''
      - en: 'Where this assessment indicates that the processing would harm the privacy of Data Subjects,
          we do not proceed on the strength of the assessment alone: we address the causes of that harm,
          and we conduct the impact assessment again on the amended processing. (Reg. Art. 25-4)'
        ar: ومتى أظهر هذا التقييم أن المعالجة ستُلحق ضرراً بخصوصية أصحاب البيانات الشخصية، فلا نمضي فيها
          استناداً إلى التقييم وحده، بل نعالج أسباب ذلك الضرر، ونُعيد إجراء تقييم الأثر على المعالجة بعد
          تعديلها. (اللائحة م.25-4)
    - - ''
      - en: We repeat this assessment whenever the activity, the data it processes, or the risks it carries
          change materially — a DPIA describes a processing activity as it is, not as it was at launch.
        ar: ونُعيد هذا التقييم كلما تغيّر النشاط أو البيانات التي يعالجها أو المخاطر التي ينطوي عليها
          تغيّراً جوهرياً — فتقييم الأثر يصف نشاط المعالجة كما هو، لا كما كان عند إطلاقه.
