blocks:
- cover:
    title:
      en: Data Protection Impact Assessment
      ar: تقييم الأثر لحماية البيانات الشخصية
    subtitle:
      en: DPIA — Personal Data Protection Law (PDPL), Kingdom of Saudi Arabia
      ar: تقييم الأثر — نظام حماية البيانات الشخصية، المملكة العربية السعودية
- snapshot:
    rows:
    - - en: Controller
        ar: جهة التحكم
      - '{{COMPANY_NAME}}'
    - - en: Data Protection Officer
        ar: مسؤول حماية البيانات
      - '{{DPO_EMAIL}}'
    - - en: Legal basis for this document
        ar: الأساس النظامي لهذه الوثيقة
      - en: Implementing Regulation, Art. 25
        ar: اللائحة التنفيذية، المادة 25
    - - en: When required
        ar: متى يلزم
      - en: Before high-risk processing (see the checklist)
        ar: قبل المعالجة عالية الخطورة (انظر قائمة التحقق)
    - - en: Version / Effective date
        ar: الإصدار / تاريخ النفاذ
      - '{{VERSION}}  ·  {{EFFECTIVE_DATE}}'
- lead:
    text:
      en: 'A DPIA is a written assessment of the privacy risks of a processing activity, carried out BEFORE
        the activity begins, so risks are found and reduced early. Under Article 25 of the Implementing
        Regulation, {{COMPANY_NAME}} conducts a DPIA for the high-risk cases below. This document is the
        method and a reusable form: complete one DPIA per high-risk activity.'
      ar: 'تقييم الأثر هو تقييم مكتوب لمخاطر الخصوصية الناتجة عن نشاط معالجة، يُجرى قبل بدء النشاط، بحيث
        تُكتشف المخاطر وتُقلَّل مبكراً. وبموجب المادة (25) من اللائحة التنفيذية، تُجري {{COMPANY_NAME}}
        تقييم أثر للحالات عالية الخطورة أدناه. وهذه الوثيقة هي المنهجية ونموذج قابل لإعادة الاستخدام:
        استكمل تقييماً واحداً لكل نشاط عالي الخطورة.'
- helper:
    text:
      en: 'How to use this template: replace each [SQUARE BRACKET] with your own value. Everything shown
        in RED (in parentheses) is guidance — delete it before you publish. The rest is the ready legal
        text; keep it.'
      ar: 'طريقة استخدام النموذج: استبدل كل [قوس مربّع] بقيمتك الخاصة. وكل ما هو باللون الأحمر (بين قوسين)
        هو إرشاد — احذفه قبل الاعتماد. أما البقية فهي النص النظامي الجاهز؛ احتفظ به.'
- section:
    level: 1
    text:
      en: When Is a DPIA Required? — Trigger Checklist
      ar: متى يلزم تقييم الأثر؟ — قائمة تحقق
- helper:
    text:
      en: Tick any that apply to the activity. If even ONE is ticked, a DPIA is required (Reg. Art. 25-1).
      ar: حدّد ما ينطبق على النشاط. إذا تحقّق بند واحد على الأقل، فيلزم إجراء تقييم أثر (اللائحة م.25-1).
- table:
    headers:
    - ✓
    - en: Trigger
      ar: المُحفّز
    - ✓
    - en: Trigger
      ar: المُحفّز
    rows:
    - - ☐
      - en: Processing sensitive data
        ar: معالجة البيانات الحساسة
      - ☐
      - en: Linking 2+ datasets from different sources
        ar: ربط مجموعتين أو أكثر من مصادر مختلفة
    - - ☐
      - en: Large-scale AND repetitive processing of the data of persons with partial or no legal capacity
        ar: معالجة واسعة النطاق ومتكررة لبيانات ناقصي الأهلية أو عديميها
      - ☐
      - en: Processing that by its nature requires constant monitoring of Data Subjects
        ar: معالجة تتطلب بطبيعتها مراقبة مستمرة لأصحاب البيانات
    - - ☐
      - en: Processing based on newly adopted technologies
        ar: معالجة تعتمد على تقنيات حديثة الاستخدام
      - ☐
      - en: Making decisions based on automated processing of Personal Data
        ar: اتخاذ قرارات بناءً على المعالجة الآلية للبيانات الشخصية
    - - ☐
      - en: Providing a product or service whose processing is likely to cause serious harm to Data Subjects'
          privacy
        ar: تقديم منتج أو خدمة تنطوي معالجتها على احتمال إلحاق ضرر جسيم بخصوصية أصحاب البيانات
      - ☐
      - en: '[ADD YOUR OWN TRIGGER]'
        ar: '[أضف حالة أخرى لديك]'
    widths:
    - 494900
    - 3040100
    - 494900
    - 3040100
    centers:
    - 0
    - 2
- callout:
    title:
      en: No trigger ticked?
      ar: لم يتحقق أي مُحفّز؟
    items:
    - en: If none apply, a full DPIA is not mandatory — but record that you screened the activity and
        found it low-risk. When in doubt, do the DPIA.
      ar: إذا لم ينطبق أي بند، فلا يلزم تقييم أثر كامل — لكن سجّل أنك فحصت النشاط ووجدته منخفض الخطورة.
        وعند الشك، أجرِ التقييم.
    kind: help
- section:
    level: 2
    text:
      en: What the DPIA Must Contain
      ar: ما يجب أن يتضمنه تقييم الأثر
- lead:
    text:
      en: 'Each DPIA must include, at a minimum (Reg. Art. 25-2):'
      ar: 'يجب أن يتضمن كل تقييم أثر، كحد أدنى (اللائحة م.25-2):'
- table:
    headers:
    - '#'
    - en: Required element
      ar: العنصر المطلوب
    rows:
    - - '1'
      - en: Purpose of the processing and its legal basis.
        ar: غرض المعالجة وأساسها النظامي.
    - - '2'
      - en: Nature and types of data, its sources, and the recipients.
        ar: طبيعة المعالجة وأنواع البيانات ومصادرها والمستقبِلون.
    - - '3'
      - en: Scope of processing and its geographic scope.
        ar: نطاق المعالجة ونطاقها الجغرافي.
    - - '4'
      - en: Context of the processing and the relationships involved.
        ar: سياق المعالجة والعلاقات ذات الصلة.
    - - '5'
      - en: Necessity, proportionality, and data minimization.
        ar: الضرورة والتناسب وتقليل البيانات.
    - - '6'
      - en: Severity and likelihood of the impact on data subjects.
        ar: شدة الأثر على أصحاب البيانات واحتماله.
    - - '7'
      - en: Measures to prevent or mitigate the risks, and their suitability.
        ar: تدابير منع المخاطر أو الحد منها ومدى ملاءمتها.
