- section:
    level: 3
    text:
      en: How We Obtain and Rely on Consent
      ar: كيف نحصل على الموافقة ونستند إليها
- bullets:
    items:
    - - en: Before non-essential cookies —
        ar: قبل الملفات غير الضرورية —
      - en: no analytics, functional or marketing cookie is set before you consent through the cookie
          banner; strictly-necessary cookies are set without consent because the service depends on them.
        ar: لا يُفعَّل أي ملف تحليلي أو وظيفي أو تسويقي قبل موافقتك عبر إشعار ملفات الارتباط؛ أما الضرورية
          فتُفعَّل دون موافقة لأن الخدمة تعتمد عليها.
    - - en: Valid consent —
        ar: موافقة صحيحة —
      - en: consent is freely given, specific to each category, informed, and given by a clear affirmative
          action; it is never bundled and never obtained by misleading design (Law Art. 5 · Reg. Art. 11).
        ar: تكون الموافقة حرة، ومحدّدة لكل فئة، ومستنيرة، وبفعل إيجابي واضح؛ ولا تُجمَع ولا تُنتزع بتصميم
          مضلِّل (النظام م.5 · اللائحة م.11).
    - - en: As easy to refuse as to accept —
        ar: الرفض بسهولة القبول —
      - en: refusing non-essential cookies is as easy as accepting them, and declining does not deny you
          access to the core service.
        ar: رفض الملفات غير الضرورية بسهولة قبولها، ولا يحرمك الرفض من الوصول إلى الخدمة الأساسية.
    - - en: Withdraw at any time —
        ar: السحب في أي وقت —
      - en: you may change or withdraw your consent at any time; withdrawal takes effect without undue
          delay and does not affect processing carried out beforehand.
        ar: لك تغيير موافقتك أو سحبها في أي وقت؛ ويسري السحب دون تأخير غير مبرر ولا يؤثر على معالجة تمت
          قبله.
- section:
    level: 4
    text:
      en: Managing Your Preferences
      ar: إدارة تفضيلاتك
- lead:
    text:
      en: You can review and change your choices at any time through our cookie-preferences control at
        {{PREFERENCE_LINK}}, and through your browser or device settings, which let you block or delete
        cookies. Blocking strictly-necessary cookies may stop parts of the service from working. For any
        question, contact us at {{PRIVACY_EMAIL}}.
      ar: يمكنك مراجعة خياراتك وتغييرها في أي وقت عبر أداة تفضيلات ملفات الارتباط لدينا على {{PREFERENCE_LINK}}،
        وعبر إعدادات متصفّحك أو جهازك التي تتيح حظر الملفات أو حذفها. وقد يؤدي حظر الملفات الضرورية إلى
        تعطّل أجزاء من الخدمة. ولأي استفسار، تواصل معنا على {{PRIVACY_EMAIL}}.
- section:
    level: 5
    text:
      en: Third-Party Cookies and Transfer
      ar: ملفات الغير والنقل
- lead:
    text:
      en: Some cookies are set by third parties that provide analytics or advertising on our behalf;
        those parties are listed in the register below and act under our instructions. Where a provider
        processes the data outside the Kingdom, the transfer follows our Cross-Border Data Transfer
        Policy and Article 29 of the Law.
      ar: تُفعَّل بعض الملفات من أطراف أخرى تقدّم التحليلات أو الإعلان نيابةً عنا، وهي مُدرَجة في السجل
        أدناه وتعمل وفق تعليماتنا. ومتى عالج مزوّدٌ البيانات خارج المملكة، اتّبع النقلُ سياسة نقل البيانات
        خارج المملكة والمادة (29) من النظام.
- page_break
- section:
    level: 6
    text:
      en: Cookie Register
      ar: سجل ملفات الارتباط
- lead:
    text:
      en: Every cookie in use is recorded here — its name, who sets it, its category, purpose and
        retention. This register is the evidence that our use of cookies is transparent and lawful.
      ar: يُدوَّن هنا كل ملف ارتباط مستخدَم — اسمه، ومن يضعه، وفئته، وغرضه، ومدّة احتفاظه. وهذا السجل هو
        الدليل على أن استخدامنا لملفات الارتباط شفّاف ومشروع.
