- lead:
    text:
      en: This policy explains how {{COMPANY_NAME}} uses cookies and similar tracking technologies on
        {{COMPANY_WEBSITE}} and its applications, the categories we use, the legal basis for each, and
        how you control them. Where a cookie or similar technology collects data that identifies you,
        directly or indirectly, it is Personal Data and the Personal Data Protection Law applies. This
        policy forms part of, and is read with, our Privacy Policy.
      ar: توضّح هذه السياسة كيف تستخدم {{COMPANY_NAME}} ملفات الارتباط والتقنيات المتتبِّعة المشابهة على
        {{COMPANY_WEBSITE}} وتطبيقاتها، والفئات التي نستخدمها، والأساس النظامي لكلٍّ منها، وكيف تتحكّم بها.
        ومتى جمع ملف ارتباط أو تقنية مشابهة بياناتٍ تُعرِّفك بشكل مباشر أو غير مباشر، فهي بيانات شخصية
        ينطبق عليها نظام حماية البيانات الشخصية. وتُعدّ هذه السياسة جزءاً من سياسة الخصوصية وتُقرأ معها.
- section:
    level: 1
    text:
      en: What Cookies and Similar Technologies Are
      ar: ما ملفات الارتباط والتقنيات المشابهة
- lead:
    text:
      en: A cookie is a small file a website places on your device to remember information about your
        visit. "Similar technologies" include local storage, software development kits (SDKs), pixels,
        tags and device identifiers that serve the same functions. We refer to all of these as "cookies"
        in this policy.
      ar: ملف الارتباط ملفٌ صغير يضعه الموقع على جهازك لتذكّر معلومات عن زيارتك. وتشمل "التقنيات المشابهة"
        التخزين المحلي وحزم تطوير البرمجيات (SDK) والبكسلات والوسوم ومعرّفات الأجهزة التي تؤدي الوظائف
        نفسها. ونشير إليها جميعاً بـ"ملفات الارتباط" في هذه السياسة.
- section:
    level: 2
    text:
      en: The Categories We Use
      ar: الفئات التي نستخدمها
- lead:
    text:
      en: We group cookies by function. For each category we state its purpose, whether it needs your
        consent, and how long it is retained. Strictly-necessary cookies do not require consent because
        the service cannot be delivered without them; every other category is set only after you consent.
      ar: نصنّف ملفات الارتباط بحسب وظيفتها. ونبيّن لكل فئة غرضها، وما إذا كانت تتطلّب موافقتك، ومدّة
        الاحتفاظ بها. ولا تتطلّب الملفات الضرورية الموافقة لأن الخدمة لا تُقدَّم دونها؛ أما كل فئة أخرى
        فلا تُفعَّل إلا بعد موافقتك.
