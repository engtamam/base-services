- lead:
    text:
      en: This procedure explains how {{COMPANY_NAME}} receives, verifies, and fulfils requests from Data
        Subjects exercising their rights under the Law, and the timelines and records that apply.
      ar: يوضّح هذا الإجراء كيفية استقبال {{COMPANY_NAME}} لطلبات أصحاب البيانات لممارسة حقوقهم بموجب
        النظام والتحقق منها وتنفيذها، والمُدد والسجلات المطبّقة.
