- clause:
    n: '3'
    title:
      en: Personal Data We Collect
      ar: البيانات الشخصية التي نجمعها
    paras:
    - en: We collect the categories below. For each, we indicate at the point of collection whether providing
        it is mandatory or optional for the relevant service.
      ar: نجمع الفئات التالية. ونوضّح لكل منها عند نقطة الجمع ما إذا كان تقديمها إلزامياً أو اختيارياً
        للخدمة المعنية.
- table:
    headers:
    - en: Category
      ar: الفئة
    - en: Examples
      ar: أمثلة
    - en: Mandatory / optional
      ar: إلزامي / اختياري
    rows:
    - - en: Account data
        ar: بيانات الحساب
      - en: name, national/Iqama ID, address, contact numbers — [DATA_TYPES]
        ar: الاسم، رقم الهوية/الإقامة، العنوان، أرقام التواصل — [DATA_TYPES]
      - '[MANDATORY/OPTIONAL]'
    - - en: Payment data
        ar: بيانات الدفع
      - en: card number, payment amounts
        ar: رقم البطاقة، مبالغ الدفع
      - '[MANDATORY/OPTIONAL]'
    - - en: Data from third parties
        ar: بيانات من أطراف أخرى
      - en: data obtained from other parties — [SOURCES]
        ar: بيانات من جهات أخرى — [SOURCES]
      - '[MANDATORY/OPTIONAL]'
    - - en: Cookies / technical
        ar: ملفات الارتباط / تقنية
      - en: logs, cookies, device data — [COOKIE_TYPES]
        ar: السجلات، ملفات الارتباط، بيانات الجهاز — [COOKIE_TYPES]
