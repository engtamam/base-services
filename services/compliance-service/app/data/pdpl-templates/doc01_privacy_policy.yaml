- lead:
    text:
      en: This Privacy Policy explains how {{COMPANY_NAME}} ("the Controller") collects, uses, shares,
        stores, and destroys Personal Data, and the rights available to Data Subjects. It is published
        in accordance with Article 12 of the Personal Data Protection Law, which requires the Controller
        to make a privacy policy available to Data Subjects for their information prior to collecting
        their Personal Data. It is written in clear, non-misleading language.
      ar: توضّح سياسة الخصوصية هذه كيفية قيام {{COMPANY_NAME}} ("جهة التحكم") بجمع البيانات الشخصية واستخدامها
        ومشاركتها وتخزينها وإتلافها، والحقوق المتاحة لأصحاب البيانات. وقد نُشرت وفقاً للمادة (12) من نظام
        حماية البيانات الشخصية التي تُلزم جهة التحكم بإتاحة سياسة الخصوصية لأصحاب البيانات للاطلاع عليها
        قبل جمع بياناتهم الشخصية. وهي مكتوبة بلغة واضحة وغير مضللة.
- clause:
    n: '1'
    title:
      en: Controller — Name and Activity
      ar: جهة التحكم — الاسم والنشاط
    paras:
    - en: 'Official name: {{COMPANY_NAME}}. Activity, services and target group: {{COMPANY_ACTIVITY}}.'
      ar: 'الاسم الرسمي: {{COMPANY_NAME}}. النشاط والخدمات والفئة المستهدفة: {{COMPANY_ACTIVITY}}.'
- clause:
    n: '2'
    title:
      en: Contact Information, DPO and Update Record
      ar: معلومات التواصل ومسؤول حماية البيانات وسجل التحديث
    paras:
    - en: 'Address: {{COMPANY_ADDRESS}} · Phone: {{COMPANY_PHONE}} · Website: {{COMPANY_WEBSITE}}.'
      ar: 'العنوان: {{COMPANY_ADDRESS}} · الهاتف: {{COMPANY_PHONE}} · الموقع الإلكتروني: {{COMPANY_WEBSITE}}.'
    - en: 'Data Protection Officer: {{DPO_EMAIL}} · {{DPO_PHONE}}. The DPO can provide further details
        about the processing of Personal Data. The name of the officer currently holding this role is
        recorded in the contact annex to this policy.'
      ar: 'مسؤول حماية البيانات: {{DPO_EMAIL}} · {{DPO_PHONE}}. ويمكن لمسؤول حماية البيانات تقديم مزيد
        من التفاصيل حول معالجة البيانات الشخصية. ويُدوَّن اسم الموظف الذي يشغل هذا الدور حاليًا في ملحق
        بيانات التواصل المرفق بهذه السياسة.'
    - en: Update record — every amendment to this policy is logged below (version, date, summary).
      ar: سجل التحديث — يُدوَّن كل تعديل على هذه السياسة أدناه (الإصدار، التاريخ، ملخص التغيير).
