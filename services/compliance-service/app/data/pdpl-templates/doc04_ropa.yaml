- callout:
    title:
      en: How many do I need?
      ar: كم عدد السجلات المطلوبة؟
    items:
    - en: One record per ticked activity. If you ticked 12 activities, you complete 12 records.
      ar: سجل واحد لكل نشاط محدّد. إذا حددت 12 نشاطاً، فتستكمل 12 سجلاً.
    kind: help
- section:
    level: 4
    text:
      en: Worked Example — One Completed Record
      ar: مثال مُستكمل — سجل واحد مكتمل
- helper:
    text:
      en: Illustration only — shows how one activity ("Payroll") is recorded. Delete this whole section;
        replace with your own.
      ar: للتوضيح فقط — يبيّن كيفية تسجيل نشاط واحد ("الرواتب"). احذف هذا القسم بالكامل واستبدله بنشاطك.
- fields:
    rows:
    - - en: Activity name / reference
        ar: اسم النشاط / المرجع
      - en: Payroll — PR-01
        ar: الرواتب — PR-01
    - - en: Owner / business unit
        ar: المالك / الوحدة
      - en: Finance / HR
        ar: المالية / الموارد البشرية
    - - en: Purpose(s) of processing
        ar: أغراض المعالجة
      - en: Pay employees and remit statutory deductions
        ar: صرف رواتب الموظفين وتوريد الاستقطاعات النظامية
    - - en: Legal basis (Art. 5/6)
        ar: الأساس النظامي (م.5/6)
      - en: Contract & legal obligation
        ar: التعاقد والالتزام النظامي
    - - en: Personal-data categories
        ar: فئات البيانات الشخصية
      - en: Name, ID, IBAN, salary, deductions
        ar: الاسم، الهوية، الآيبان، الراتب، الاستقطاعات
    - - en: Data-subject categories
        ar: فئات أصحاب البيانات
      - en: Employees
        ar: الموظفون
    - - en: Recipients (categories)
        ar: المستقبِلون (الفئات)
      - en: Bank, GOSI, tax authority
        ar: البنك، التأمينات، هيئة الزكاة والضريبة
    - - en: Cross-border transfer?
        ar: نقل خارج المملكة؟
      - en: None
        ar: لا يوجد
    - - en: Retention period
        ar: مدة الاحتفاظ
      - en: 7 years after employment ends
        ar: 7 سنوات بعد انتهاء العلاقة الوظيفية
    - - en: Security measures
        ar: التدابير الأمنية
      - en: Encryption, role-based access, audit logs
        ar: التشفير، صلاحيات حسب الدور، سجلات التدقيق
    - - en: Date created / last reviewed
        ar: تاريخ الإنشاء / آخر مراجعة
      - en: 2025-01-01 / 2025-06-01
        ar: ٢٠٢٥-٠١-٠١ / ٢٠٢٥-٠٦-٠١
    sample: true
- section:
    level: 5
    text:
      en: Processing Activity Record — Blank Template
      ar: سجل نشاط المعالجة — نموذج فارغ
- helper:
    text:
      en: Complete one record for every ticked activity. Duplicate this block as needed. Replace each
        [SQUARE BRACKET] with your value; delete the red (guidance) notes.
      ar: استكمل سجلاً واحداً لكل نشاط محدّد. كرّر هذا القالب حسب الحاجة. استبدل كل [قوس مربّع] بقيمتك؛
        واحذف الملاحظات الحمراء (الإرشادية).
- fields:
    rows:
    - - en: Activity name / reference
        ar: اسم النشاط / المرجع
      - '[ACTIVITY]'
      - en: e.g. "Recruitment — REC-01"; give each a short code
        ar: مثل "التوظيف — REC-01"؛ امنح كل نشاط رمزاً مختصراً
    - - en: Owner / business unit
        ar: المالك / الوحدة
      - '[OWNER]'
      - en: the team accountable, e.g. "HR"
        ar: الفريق المسؤول، مثل "الموارد البشرية"
    - - en: Purpose(s) of processing
        ar: أغراض المعالجة
      - '[PURPOSE]'
      - en: the why, not the system, e.g. "Shortlist job applicants"
        ar: الغرض لا النظام، مثل "فرز المتقدمين للوظائف"
    - - en: Legal basis (Art. 5/6)
        ar: الأساس النظامي (م.5/6)
      - '[LEGAL_BASIS]'
      - en: 'pick one: Consent / Contract / Legal obligation / Legitimate interest'
        ar: 'اختر واحداً: الموافقة / التعاقد / التزام نظامي / مصلحة مشروعة'
    - - en: Personal-data categories
        ar: فئات البيانات الشخصية
      - '[DATA_CATEGORIES]'
      - en: e.g. name, ID, CV, contact; flag any sensitive data
        ar: مثل الاسم، الهوية، السيرة، التواصل؛ وأشر لأي بيانات حساسة
    - - en: Data-subject categories
        ar: فئات أصحاب البيانات
      - '[SUBJECT_CATEGORIES]'
      - en: e.g. employees / customers / applicants
        ar: مثل الموظفون / العملاء / المتقدمون
    - - en: Recipients (categories)
        ar: المستقبِلون (الفئات)
      - '[RECIPIENTS]'
      - en: who receives it, e.g. "payroll processor, bank"
        ar: من يستلمها، مثل "معالج الرواتب، البنك"
    - - en: Cross-border transfer? basis + recipients
        ar: نقل خارج المملكة؟ الأساس + المستقبِلون
      - '[TRANSFER]'
      - en: '"None", or "AWS eu-west-1 — adequacy decision"'
        ar: '"لا يوجد"، أو "AWS eu-west-1 — قرار كفاية"'
    - - en: Retention period
        ar: مدة الاحتفاظ
      - '[RETENTION_PERIOD]'
      - en: trigger + duration, e.g. "7 yrs after employment ends"
        ar: المحفّز + المدة، مثل "7 سنوات بعد انتهاء التوظيف"
    - - en: Security measures
        ar: التدابير الأمنية
      - '[SECURITY_MEASURES]'
      - en: outcomes not products, e.g. "encryption, access control, logging"
        ar: النتائج لا المنتجات، مثل "التشفير، ضبط الوصول، التسجيل"
    - - en: Date created / last reviewed
        ar: تاريخ الإنشاء / آخر مراجعة
      - '[DATE]'
      - en: format YYYY-MM-DD
        ar: الصيغة سنة-شهر-يوم
    sample: false
- callout:
    title:
      en: Keep it current
      ar: أبقِه محدّثاً
    items:
    - en: Review each record periodically and whenever the activity changes.
      ar: راجع كل سجل دورياً وكلما تغيّر النشاط.
    - en: Retain a ceased activity's record for five years before disposal.
      ar: احتفظ بسجل النشاط المتوقف لمدة خمس سنوات قبل التخلص منه.
    kind: info
