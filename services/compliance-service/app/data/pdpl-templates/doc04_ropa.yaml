blocks:
- cover:
    title:
      en: Records of Processing Activities
      ar: سجل أنشطة معالجة البيانات الشخصية
    subtitle:
      en: ROPA — Personal Data Protection Law (PDPL), Kingdom of Saudi Arabia
      ar: سجل المعالجة — نظام حماية البيانات الشخصية، المملكة العربية السعودية
- snapshot:
    rows:
    - - en: Controller
        ar: جهة التحكم
      - '{{COMPANY_NAME}}'
    - - en: Data Protection Officer
        ar: مسؤول حماية البيانات
      - '{{DPO_EMAIL}}'
    - - en: Legal basis for this document
        ar: الأساس النظامي لهذه الوثيقة
      - en: Law Art. 31 · SDAIA ROPA Guideline
        ar: النظام م.31 · دليل سدايا للسجل
    - - en: Retention of records
        ar: الاحتفاظ بالسجل
      - en: 5 years after a processing activity ceases
        ar: 5 سنوات بعد توقف نشاط المعالجة
    - - en: Version / Effective date
        ar: الإصدار / تاريخ النفاذ
      - '{{VERSION}}  ·  {{EFFECTIVE_DATE}}'
- lead:
    text:
      en: Without prejudice to Article 18 of the Law, {{COMPANY_NAME}} maintains records of its Personal
        Data processing activities, based on the nature of the activity it carries out, and makes them
        available whenever the Competent Authority requests them. This document sets out those obligations,
        the minimum contents the Law and the Regulation require of each record, and the record template
        completed for every processing activity. (Law Art. 31 · Reg. Art. 33)
      ar: دون الإخلال بالمادة (18) من النظام، تحتفظ {{COMPANY_NAME}} بسجلات لأنشطة معالجتها للبيانات الشخصية،
        بحسب طبيعة النشاط الذي تمارسه، وتُتيحها للجهة المختصة متى طلبتها. وتحدّد هذه الوثيقة تلك الالتزامات،
        والحد الأدنى لمحتويات كل سجل كما يوجبه النظام واللائحة، ونموذج السجل الذي يُستكمل لكل نشاط معالجة.
        (النظام م.31 · اللائحة م.33)
- helper:
    text:
      en: 'How to use this template: replace each [SQUARE BRACKET] with your own value. Everything shown
        in RED (in parentheses) is guidance — delete it before you publish. The rest is the ready legal
        text; keep it.'
      ar: 'طريقة استخدام النموذج: استبدل كل [قوس مربّع] بقيمتك الخاصة. وكل ما هو باللون الأحمر (بين قوسين)
        هو إرشاد — احذفه قبل الاعتماد. أما البقية فهي النص النظامي الجاهز؛ احتفظ به.'
- section:
    level: 1
    text:
      en: Record-Keeping Obligations
      ar: التزامات حفظ السجل
- bullets:
    items:
    - - ''
      - en: We maintain a record of processing activities for as long as we process Personal Data, and
          we keep each record for five years after the processing activity it describes has ceased.
        ar: نحتفظ بسجل لأنشطة معالجة البيانات الشخصية طوال مدة معالجتنا لها، ونحتفظ بكل سجل مدة خمس سنوات
          بعد توقف نشاط المعالجة الذي يصفه.
    - - ''
      - en: We keep the records accurate and up to date, and we update a record when the activity it describes
          changes rather than at a fixed interval.
        ar: ونُبقي السجلات دقيقة ومحدّثة، ونُحدّث السجل عند تغيّر النشاط الذي يصفه، لا على فترات ثابتة.
    - - ''
      - en: The records are written, kept in a form that lets us produce them immediately, and made available
          to the Competent Authority (SDAIA) whenever it requests them.
        ar: وتكون السجلات مكتوبة، ومحفوظة بصيغة تتيح إبرازها فوراً، ومُتاحة للجهة المختصة (سدايا) متى
          طلبتها.
- section:
    level: 2
    text:
      en: Minimum Contents of Each Record
      ar: الحد الأدنى لمحتويات كل سجل
- lead:
    text:
      en: Each processing-activity record contains, as a minimum, the eight elements the Regulation requires.
        The Law separately requires the record to state whether the Personal Data has been or will be
        transferred outside the Kingdom or disclosed to an entity outside it, which row 7 records. (Law
        Art. 31 · Reg. Art. 33-5)
      ar: يتضمن كل سجل نشاط معالجة، كحد أدنى، العناصر الثمانية التي توجبها اللائحة. ويوجب النظام كذلك
        أن يبيّن السجل ما إذا كانت البيانات الشخصية قد نُقلت أو ستُنقل خارج المملكة أو أُفصح عنها لجهة
        خارجها، وهو ما يسجّله البند (7). (النظام م.31 · اللائحة م.33-5)
- table:
    headers:
    - '#'
    - en: Required element
      ar: العنصر المطلوب
    rows:
    - - '1'
      - en: Controller's name and contact details.
        ar: اسم جهة التحكم وبيانات التواصل معها.
    - - '2'
      - en: DPO information (where a DPO is required).
        ar: معلومات مسؤول حماية البيانات (متى لزم تعيينه).
    - - '3'
      - en: Purposes of the processing.
        ar: أغراض المعالجة.
    - - '4'
      - en: Categories of personal data and of data subjects.
        ar: فئات البيانات الشخصية وفئات أصحابها.
    - - '5'
      - en: Retention period (per data category where possible).
        ar: مدة الاحتفاظ (لكل فئة بيانات عند الإمكان).
    - - '6'
      - en: Categories of recipient entities.
        ar: فئات الجهات المستقبِلة.
    - - '7'
      - en: Cross-border transfers — legal basis and recipients.
        ar: عمليات النقل خارج المملكة — الأساس النظامي والمستقبِلون.
    - - '8'
      - en: Security measures in place (where possible).
        ar: التدابير الأمنية المطبّقة (عند الإمكان).
    widths:
    - 565600
    - 6504400
    centers:
    - 0
- page_break
- section:
    level: 3
    text:
      en: Common Processing Activities — Checklist
      ar: أنشطة المعالجة الشائعة — قائمة تحقق
- helper:
    text:
      en: A "processing activity" is any purpose for which you use personal data. Most organizations have
        10–20. Tick the ones that apply, add your own, then complete one record (Section 5) for each ticked
        item.
      ar: '"نشاط المعالجة" هو أي غرض تستخدم فيه البيانات الشخصية. لدى معظم المنشآت من 10 إلى 20 نشاطاً.
        حدّد ما ينطبق عليك، وأضف أنشطتك الخاصة، ثم استكمل سجلاً (البند 5) لكل نشاط محدّد.'
