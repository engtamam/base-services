blocks:
- cover:
    title:
      en: Data Processing Agreement
      ar: اتفاقية معالجة البيانات
    subtitle:
      en: Personal Data Protection Law (PDPL) — Kingdom of Saudi Arabia
      ar: نظام حماية البيانات الشخصية — المملكة العربية السعودية
- snapshot:
    rows:
    - - en: Controller
        ar: جهة التحكم
      - '{{COMPANY_NAME}}'
    - - en: Processor
        ar: المعالِج
      - '{{PROCESSOR_NAME}}'
    - - en: Legal basis for this document
        ar: الأساس النظامي لهذه الوثيقة
      - en: Reg. Art. 17 · Law Arts. 18, 19, 20, 29
        ar: اللائحة م.17 · النظام م.18، 19، 20، 29
    - - en: Version / Effective date
        ar: الإصدار / تاريخ النفاذ
      - '{{VERSION}}  ·  {{EFFECTIVE_DATE}}'
- lead:
    text:
      en: This Agreement governs the Processing of Personal Data that {{PROCESSOR_NAME}} ("the Processor")
        carries out on behalf of {{COMPANY_NAME}} ("the Controller"). It sets out the instructions,
        obligations and safeguards the Personal Data Protection Law and Article 17 of its Implementing
        Regulation require whenever a Controller engages a Processor. It applies to all Personal Data the
        Processor processes for the Controller and forms part of the service contract between them.
      ar: تحكم هذه الاتفاقية معالجة البيانات الشخصية التي يقوم بها {{PROCESSOR_NAME}} ("المعالِج") نيابةً عن
        {{COMPANY_NAME}} ("جهة التحكم"). وتبيّن التعليمات والالتزامات والضمانات التي يوجبها نظام حماية
        البيانات الشخصية والمادة (17) من لائحته التنفيذية كلما استعانت جهة تحكم بمعالِج. وتنطبق على كل
        البيانات الشخصية التي يعالجها المعالِج لجهة التحكم، وتُعدّ جزءاً من عقد الخدمة بينهما.
- section:
    level: 1
    text:
      en: Roles and Instructions
      ar: الأدوار والتعليمات
- bullets:
    items:
    - - en: Processing on instructions —
        ar: المعالجة بالتعليمات —
      - en: the Processor processes Personal Data only on the Controller's documented instructions and
          only for the purpose in Annex A; the Controller issues clear instructions (Reg. Art. 17-2).
        ar: يعالج المعالِج البيانات الشخصية فقط وفق تعليمات جهة التحكم الموثّقة ولغرض الملحق (أ) فقط؛
          وتُصدر جهة التحكم تعليمات واضحة (اللائحة م.17-2).
    - - en: Notify on conflict —
        ar: الإشعار عند التعارض —
      - en: if an instruction, or any applicable law in the Kingdom, would be violated, the Processor
          notifies the Controller in writing without undue delay (Reg. Art. 17-2).
        ar: إذا كان في تعليمٍ، أو في أي نظام مطبَّق في المملكة، مخالفةٌ، يُشعِر المعالِج جهة التحكم كتابةً
          دون تأخير غير مبرر (اللائحة م.17-2).
    - - en: Breach of instructions —
        ar: مخالفة التعليمات —
      - en: if the Processor breaches the Controller's instructions or this Agreement regarding the
          Processing, the Processor is treated as a Controller and is directly accountable for any
          violation of the Law (Reg. Art. 17-4).
        ar: إذا خالف المعالِج تعليمات جهة التحكم أو هذه الاتفاقية في شأن المعالجة، عُدَّ جهة تحكم وتحمّل
          المسؤولية المباشرة عن أي مخالفة للنظام (اللائحة م.17-4).
- section:
    level: 2
    text:
      en: What This Agreement Includes
      ar: ما تتضمّنه هذه الاتفاقية
- lead:
    text:
      en: 'In line with Article 17-1 of the Regulation, this Agreement and its annexes state each of the
        following:'
      ar: 'تماشياً مع المادة (17-1) من اللائحة، تبيّن هذه الاتفاقية وملاحقها كلاً مما يلي:'
- bullets:
    items:
    - - en: Purpose —
        ar: الغرض —
      - en: the purpose of the Processing (Annex A · Reg. Art. 17-1-a).
        ar: غرض المعالجة (الملحق أ · اللائحة م.17-1-أ).
    - - en: Categories —
        ar: الفئات —
      - en: the categories of Personal Data being processed (Annex A · Reg. Art. 17-1-b).
        ar: فئات البيانات الشخصية محل المعالجة (الملحق أ · اللائحة م.17-1-ب).
    - - en: Duration —
        ar: المدّة —
      - en: the duration of the Processing (Annex A · Reg. Art. 17-1-c).
        ar: مدّة المعالجة (الملحق أ · اللائحة م.17-1-ج).
    - - en: Breach notification —
        ar: الإشعار بالانتهاك —
      - en: the Processor's commitment to notify the Controller, without undue delay, of any Personal
          Data Breach (§3 · Reg. Art. 17-1-d).
        ar: التزام المعالِج بإشعار جهة التحكم، دون تأخير غير مبرر، بأي انتهاك للبيانات الشخصية (البند 3 ·
          اللائحة م.17-1-د).
    - - en: Foreign laws —
        ar: الأنظمة الأجنبية —
      - en: whether the Processor is subject to regulations in other countries, and the impact on its
          compliance with the Law (§6 · Reg. Art. 17-1-e).
        ar: ما إذا كان المعالِج خاضعاً لأنظمة دول أخرى، وأثر ذلك على امتثاله للنظام (البند 6 · اللائحة
          م.17-1-هـ).
    - - en: Mandatory disclosure —
        ar: الإفصاح الإلزامي —
      - en: no prior consent of the Data Subject is required for a Disclosure made mandatory by the laws
          in force in the Kingdom, provided the Processor notifies the Controller of it (§7 · Reg. Art.
          17-1-f).
        ar: لا تُشترط موافقة صاحب البيانات المسبقة لإفصاحٍ تُوجبه الأنظمة النافذة في المملكة، شريطة أن
          يُشعِر المعالِج جهة التحكم به (البند 7 · اللائحة م.17-1-و).
    - - en: Sub-processors —
        ar: المعالِجون الفرعيون —
      - en: identification of any subcontractor the Processor engages, or any other party to whom Personal
          Data is disclosed (Annex C · Reg. Art. 17-1-g).
        ar: تحديد أي معالِج فرعي يستعين به المعالِج، أو أي جهة أخرى يُفصَح لها عن البيانات الشخصية (الملحق
          ج · اللائحة م.17-1-ز).
- section:
    level: 3
    text:
      en: Personal Data Breach
      ar: انتهاك البيانات الشخصية
- lead:
    text:
      en: The Processor notifies the Controller of any Personal Data Breach without undue delay, with the
        information the Controller needs to meet its own duty to notify the Competent Authority — and,
        where the breach may cause damage or affect the rights of Data Subjects, to notify them (Reg. Art.
        17-1-d · Law Art. 20).
      ar: يُشعِر المعالِج جهة التحكم بأي انتهاك للبيانات الشخصية دون تأخير غير مبرر، بالمعلومات التي
        تحتاجها للوفاء بواجبها في إشعار الجهة المختصة — وعند احتمال أن يُسبّب الانتهاك ضرراً أو يمسّ حقوق
        أصحاب البيانات، في إشعارهم (اللائحة م.17-1-د · النظام م.20).
- section:
    level: 4
    text:
      en: Security and Confidentiality
      ar: الأمن والسرّية
- lead:
    text:
      en: The Processor implements the organizational, administrative and technical measures necessary to
        protect the Personal Data — proportionate to the nature of the Processing and the sensitivity and
        amount of data — including the measures in Annex B, and ensures its personnel are bound by
        confidentiality (Law Art. 19).
      ar: ينفّذ المعالِج التدابير التنظيمية والإدارية والتقنية اللازمة لحماية البيانات الشخصية — بما
        يتناسب مع طبيعة المعالجة وحساسية البيانات وكميتها — بما فيها تدابير الملحق (ب)، ويضمن التزام
        منسوبيه بالسرّية (النظام م.19).
- section:
    level: 5
    text:
      en: Sub-Processors
      ar: المعالِجون الفرعيون
- lead:
    text:
      en: 'Before engaging any sub-processor, the Processor shall (Reg. Art. 17-5):'
      ar: 'قبل الاستعانة بأي معالِج فرعي، على المعالِج (اللائحة م.17-5):'
- bullets:
    items:
    - - en: Sufficient guarantees —
        ar: ضمانات كافية —
      - en: take sufficient guarantees that the sub-contract will not lower the level of protection given
          to the Personal Data (Reg. Art. 17-5-a).
        ar: أخذ ضمانات كافية بألّا يُخفِّض العقد الفرعي مستوى الحماية الممنوح للبيانات الشخصية (اللائحة
          م.17-5-أ).
    - - en: Compliant sub-processors only —
        ar: معالِجون فرعيون ملتزمون فقط —
      - en: choose only sub-processors that provide sufficient guarantees to comply with the Law and its
          Regulations (Reg. Art. 17-5-b).
        ar: اختيار المعالِجين الفرعيين الذين يوفّرون ضمانات كافية للامتثال للنظام ولائحته فقط (اللائحة
          م.17-5-ب).
    - - en: Prior acceptance —
        ar: قبول مسبق —
      - en: obtain the Controller's prior acceptance, notifying it before entering the sub-contract and
          allowing it to object within the timeframe the parties agree (Reg. Art. 17-5-c).
        ar: الحصول على قبول جهة التحكم المسبق، بإشعارها قبل إبرام العقد الفرعي وتمكينها من الاعتراض خلال
          المدّة المتفق عليها بين الطرفين (اللائحة م.17-5-ج).
- section:
    level: 6
    text:
      en: Compliance Monitoring, Foreign Laws and Assessment
      ar: مراقبة الامتثال والأنظمة الأجنبية والتقييم
- bullets:
    items:
    - - en: Periodic assessment —
        ar: تقييم دوري —
      - en: the Controller periodically assesses the Processor's compliance with the Law and its
          Regulations — whether the Processing is carried out by the Processor or by parties acting on its
          behalf — and may appoint an independent third party to assess and monitor compliance on its
          behalf (Reg. Art. 17-3).
        ar: تُقيّم جهة التحكم دورياً امتثال المعالِج للنظام ولائحته — سواء تمّت المعالجة بواسطة المعالِج
          أو جهات تعمل نيابةً عنه — ولها تعيين طرف ثالث مستقل لتقييم الامتثال ومراقبته نيابةً عنها (اللائحة
          م.17-3).
    - - en: Foreign regulations —
        ar: الأنظمة الأجنبية —
      - en: the Processor states whether it is subject to regulations in other countries and the impact on
          its compliance with the Law and its Regulations (Reg. Art. 17-1-e).
        ar: يُبيّن المعالِج ما إذا كان خاضعاً لأنظمة دول أخرى وأثر ذلك على امتثاله للنظام ولائحته (اللائحة
          م.17-1-هـ).
- section:
    level: 7
    text:
      en: Mandatory Disclosure
      ar: الإفصاح الإلزامي
- lead:
    text:
      en: Where a Disclosure of Personal Data is mandatory under the laws in force in the Kingdom, the
        Data Subject's prior consent is not required, provided the Processor notifies the Controller of
        the Disclosure (Reg. Art. 17-1-f).
      ar: حيث يكون الإفصاح عن البيانات الشخصية إلزامياً بموجب الأنظمة النافذة في المملكة، لا تُشترط موافقة
        صاحب البيانات المسبقة، شريطة أن يُشعِر المعالِج جهة التحكم بالإفصاح (اللائحة م.17-1-و).
- section:
    level: 8
    text:
      en: Cross-Border Transfer, Return and Destruction
      ar: النقل خارج المملكة والإرجاع والإتلاف
- bullets:
    items:
    - - en: Cross-border —
        ar: النقل الخارجي —
      - en: the Processor does not transfer or disclose the Personal Data outside the Kingdom except under
          the Controller's instructions and in accordance with Article 29 of the Law and the Transfer
          Regulation.
        ar: لا ينقل المعالِج البيانات الشخصية أو يُفصح عنها خارج المملكة إلا بتعليمات جهة التحكم ووفق
          المادة (29) من النظام ولائحة النقل.
    - - en: On termination —
        ar: عند الإنهاء —
      - en: at the end of the Processing, the Processor returns or destroys the Personal Data at the
          Controller's choice, and destroys existing copies, except where the law requires retention (Law
          Art. 18).
        ar: عند انتهاء المعالجة، يُرجِع المعالِج البيانات الشخصية أو يُتلفها بحسب اختيار جهة التحكم، ويُتلف
          النسخ القائمة، إلا حيث يوجب النظام الاحتفاظ (النظام م.18).
