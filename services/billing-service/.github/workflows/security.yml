# =============================================================================
# billing-service — CI: tests + security gates (self-contained per service)
# Runs on every push / PR. Nothing insecure merges: pytest + the strict gate.
# =============================================================================
name: security

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (runtime + dev + ci)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ci]"

      - name: Install Trivy (container/fs scanner)
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Tests
        run: python -m pytest -q

      - name: Security gate (strict — no skips allowed)
        run: python ci/security_gate.py --strict
