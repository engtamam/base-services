[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# billing-service — rename when cloning this template.
name = "billing-service"
version = "0.1.0"
description = "Self-contained, plug-and-play FastAPI service (base-services template)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Proprietary. The SERVICE is not open source — see /LICENSE: no licence is
# granted, and use requires a signed agreement. (Its DEPENDENCIES must still be
# permissive; that is a different rule, enforced by ci/check_licenses.py.)
license = "LicenseRef-Proprietary"
authors = [{ name = "Tamam Alahdal" }]

# Runtime dependencies — PERMISSIVE LICENSES ONLY (MIT/BSD/Apache-2.0/ISC).
#   fastapi            MIT
#   uvicorn            BSD-3-Clause
#   pydantic           MIT
#   pydantic-settings  MIT
#   prometheus-client  Apache-2.0
#   pyjwt              MIT          (JWT verify — vetted crypto, never hand-rolled)
#   cryptography      Apache-2.0/BSD (pulled by pyjwt[crypto], for RS256)
# Logging uses the Python stdlib (no extra dep) to keep the attack surface minimal.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "prometheus-client>=0.20,<1.0",
    "pyjwt[crypto]>=2.8,<3.0",
]

[project.optional-dependencies]
# Infra adapter extras — install only what a service actually uses (lean base,
# smaller attack surface). ALL PERMISSIVE.
#   asyncpg   MIT/Apache | redis MIT | aioboto3 Apache-2.0 | hvac Apache-2.0
postgres = ["asyncpg>=0.29,<1.0"]
pdf = [  # BSD/MIT — optional PDF_RENDERER=reportlab (EN/AR bilingual invoices)
    "reportlab>=4.0,<5.0",
    "arabic-reshaper>=3.0,<4.0",
    "python-bidi>=0.4,<1.0",
    # BSD-3. Draws the ZATCA TLV QR onto the invoice. Was used by the renderer and NOT declared
    # here, which would have failed at runtime in any image built from this extra — the QR is
    # legally required, so it would have failed on the one thing that must not be missing.
    "segno>=1.6,<2.0",
]
redis = ["redis>=5.0,<6.0"]
s3 = ["aioboto3>=13.0,<15.0"]
vault = ["hvac>=2.0,<3.0"]

# Dev/test — PERMISSIVE ONLY.
#   pytest   MIT
#   httpx    BSD-3-Clause  (drives FastAPI TestClient)
dev = [
    "pytest>=9.0.3,<10.0",
    "httpx>=0.27,<1.0",
    # Apache-2.0/BSD-3. Rasterises and text-extracts the invoice PDF so the tests can assert what
    # a READER sees rather than that a render returned bytes. Declared here deliberately: the PDF
    # tests importorskip on it, so without it in CI they would SKIP in silence — and a document
    # test that quietly does not run is how both font defects survived in the first place.
    "pypdfium2>=4.0,<6.0",
]

# CI security tools — PERMISSIVE ONLY.
#   bandit         Apache-2.0  (SAST)
#   vulture        MIT         (dead code — a symbol nobody calls is a rule that can rot)
#   pip-audit      Apache-2.0  (dependency CVE scan)
#   detect-secrets Apache-2.0  (secret scan)
#   cyclonedx-bom  Apache-2.0  (SBOM)
ci = [
    "bandit>=1.7,<2.0",
    "vulture>=2.11,<3.0",
    "pip-audit>=2.7,<3.0",
    "detect-secrets>=1.5,<2.0",
    "cyclonedx-bom>=4.0,<7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.bandit]
# SAST scans app/ only (not tests/). Justified skips:
#   B104 — HOST binds 0.0.0.0 by operator config (deploy behind a proxy), not a hardcoded exposure.
exclude_dirs = ["tests", ".venv"]
skips = ["B104"]
