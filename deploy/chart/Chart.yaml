apiVersion: v2
name: base-service
description: >-
  One generic chart for every base-services microservice. Each service supplies a short
  values file; the chart supplies the probes, hardening, network policy and guard rails.
type: application
version: 1.0.0
appVersion: "1.0.0"
kubeVersion: ">=1.25.0-0"
keywords: [microservice, fastapi, hexagonal, k3s]
home: https://github.com/base-services
sources:
  - https://github.com/base-services
maintainers:
  - name: base-services
annotations:
  # This chart renders OFFLINE and DETERMINISTICALLY: no `lookup`, no timestamps, no
  # randomness. `helm template` twice must be byte-identical, or `helm diff` lies and
  # GitOps flaps forever. tests/deploy/test_chart_guards.py pins this.
  base-services/render: pure
