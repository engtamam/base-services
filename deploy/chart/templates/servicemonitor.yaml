{{- if .Values.metrics.serviceMonitor }}
{{/*
Prometheus scrapes /metrics over the ClusterIP Service — cluster-internal only. It is
deliberately NOT reachable through the Ingress (see guardIngressPaths).
*/}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "base-service.fullname" . }}
  labels: {{- include "base-service.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "base-service.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.interval }}
{{- end }}
