{{- if .Values.cronJobs }}
{{- if not .Values.existingSecret }}
{{- fail (printf "%s defines cronJobs but no existingSecret: the internal endpoints require INTERNAL_SERVICE_TOKEN, and it must never be inlined in a ConfigMap." .Values.service.name) }}
{{- end }}
{{/*
Scheduled maintenance callers.

Retention/prune endpoints exist in the services and have NO caller without these —
`/internal/analytics/prune-raw`, `/internal/audit/enforce-retention`, compliance sweeps.
An unenforced retention policy is a compliance finding, not a missing feature.

The job runs the SERVICE'S OWN digest-pinned image and uses the Python stdlib, so there is
no second image to pin, scan and keep CVE-free just to make an HTTP request.
*/}}
{{- $root := . }}
{{- range .Values.cronJobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "base-service.fullname" $root }}-{{ .name }}
  labels: {{- include "base-service.labels" $root | nindent 4 }}
spec:
  schedule: {{ .schedule | quote }}
  concurrencyPolicy: Forbid          # a slow sweep must never overlap itself
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      {{- /* The whole-job deadline MUST cover the work the job drives. A backup sweep that fans out
             to 20 targets at up to 120s each is 2400s worst case; with the old fixed 300s the Job was
             reaped — and the HTTP client below timed out — while the sweep was still SUCCEEDING, so a
             healthy backup was reported failed and "backup always fails" became the expected state
             that hides a real failure. timeoutSeconds is per-cronJob (default 300, so every existing
             short job is unchanged); a long sweep sets it above its own worst-case total. The Job
             deadline is that plus headroom for image pull and pod startup, so the pod is never killed
             before the call it is waiting on can return. */}}
      activeDeadlineSeconds: {{ add (.timeoutSeconds | default 300) 120 }}
      template:
        metadata:
          labels: {{- include "base-service.selectorLabels" $root | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ include "base-service.fullname" $root }}
          automountServiceAccountToken: false
          {{- /* The cronJob pulls the SAME image as the Deployment, so it needs the same pull
                 secret. Omitting it works perfectly on a public registry and fails on every
                 private one — and it fails on the scheduler tick, not at deploy time, so the
                 release goes green and the job simply never runs. */}}
          {{- with $root.Values.image.pullSecrets }}
          imagePullSecrets:
            {{- range . }}
            - name: {{ . }}
            {{- end }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: call
              image: {{ include "base-service.image" $root }}
              imagePullPolicy: {{ $root.Values.image.pullPolicy }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              env:
                - name: TARGET_URL
                  value: "http://{{ include "base-service.fullname" $root }}:{{ $root.Values.service.port }}{{ .path }}"
                - name: TIMEOUT_SECONDS
                  # Per-cronJob; must exceed the endpoint's own worst-case work (a fan-out sweep sums
                  # its targets). Default 300 keeps every short maintenance call exactly as it was.
                  value: {{ .timeoutSeconds | default 300 | quote }}
                - name: INTERNAL_SERVICE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ $root.Values.existingSecret }}
                      key: INTERNAL_SERVICE_TOKEN
              command: ["python", "-c"]
              args:
                - |
                  import os, sys, urllib.request
                  req = urllib.request.Request(
                      os.environ["TARGET_URL"], method="POST", data=b"",
                      headers={"X-Internal-Token": os.environ["INTERNAL_SERVICE_TOKEN"],
                               "Content-Type": "application/json"})
                  with urllib.request.urlopen(req, timeout=int(os.environ["TIMEOUT_SECONDS"])) as r:
                      body = r.read().decode()
                      print(f"{r.status} {body}")
                      # Any non-2xx raises above; a 2xx with a failure body is still a failure
                      # we want visible, so the Job's exit code mirrors the HTTP status.
                      sys.exit(0 if 200 <= r.status < 300 else 1)
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi
{{- end }}
{{- end }}
