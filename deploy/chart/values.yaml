# =============================================================================
# base-service — safe defaults.
#
# The defaults deploy ONE replica with in-memory drivers: correct, but not scalable.
# To scale out you MUST move every stateful port to a shared driver — see `drivers`.
# The chart refuses to render an unsafe combination rather than letting you find out
# from wrong numbers in production.
# =============================================================================

# ── Identity ────────────────────────────────────────────────────────────────
service:
  name: ""                 # REQUIRED, e.g. "analytics-service" (must equal Settings.SERVICE_NAME)
  port: 8000

nameOverride: ""
fullnameOverride: ""

# ── Image — digest-pinned. A `:latest` tag with IfNotPresent silently redeploys
#    the image already on the node, so the image is ALWAYS resolved by digest.
#    There is deliberately no `tag` knob: nothing would read it, and a config value
#    nobody reads is a lie in a config file. Record the tag in git, not here.
image:
  repository: ""           # REQUIRED, e.g. ghcr.io/base-services/analytics-service
  digest: ""               # REQUIRED, e.g. sha256:abc123...
  pullPolicy: IfNotPresent
  pullSecrets: []

# ── Scale ───────────────────────────────────────────────────────────────────
# replicas > 1 requires SHARED drivers below. Our generation-keyed caches invalidate by
# bumping a counter in the cache; an in-memory cache is per-pod, so pod A's write never
# invalidates pod B's cache. That returns stale numbers, silently, only under load.
replicas: 1

drivers:
  datastore: memory        # memory | postgres
  cache: memory            # memory | redis
  eventbus: memory         # memory | redis
  queue: memory            # memory | redis
  ratelimiter: memory      # memory | redis

# ── Resources ───────────────────────────────────────────────────────────────
# memory limit == request (OOM protection, no overcommit surprise).
# NO cpu limit on purpose: a CPU limit throttles a latency-sensitive service to enforce a
# number nobody asked for. Set `requests.cpu` so the scheduler and the HPA can do their jobs.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 128Mi          # cpu limit is rejected by the chart

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  scaleDownStabilizationSeconds: 300

podDisruptionBudget:
  enabled: true            # rendered ONLY when effective replicas > 1
  minAvailable: 1

# ── Probes ──────────────────────────────────────────────────────────────────
# liveness -> /healthz (never touches a dependency), readiness -> /readyz (does).
# The paths are NOT configurable: pointing liveness at /readyz turns one slow DB moment
# into a fleet-wide restart storm.
probes:
  startupFailureThreshold: 90   # x periodSeconds = first-boot budget (migrations, cold caches)
  periodSeconds: 5
  timeoutSeconds: 5             # NOT the 1s default: probes on a busy node exceed 1s
  # x periodSeconds = grace before a liveness kill. 10 x 5s = 50s. Raised from 6 (30s) for headroom
  # against SCHEDULING JITTER on a contended node: a single-worker uvicorn shares one event loop
  # between real traffic and /healthz, so a burst (a dashboard's ~15 concurrent calls, or CronJob pod
  # churn) can delay the probe past a tight threshold and cost a full restart — even though /healthz
  # is a dependency-free trivial handler and the process is doing nothing wrong. This is tolerance to
  # jitter, NOT hiding a hang; the CPU-request sizing per service is what actually fixes the cause.
  livenessFailureThreshold: 10

# Endpoint removal is asynchronous: without a preStop pause the pod stops accepting
# connections while the Service still routes to it — 502s on every single deploy.
terminationGracePeriodSeconds: 30
preStopSleepSeconds: 5

# ── Networking ──────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: traefik
  host: ""
  # Only the user tier is ever exposed. /internal/* is protected by a shared token and
  # /metrics leaks operational detail — neither belongs on the internet. The chart rejects
  # any path outside /api/v1.
  paths:
    - /api/v1
  annotations: {}
  tls:
    enabled: true
    secretName: ""

serviceAccount:
  # Whether the pod (and its ServiceAccount) mounts a Kubernetes API token. FALSE by default — these
  # services never call the k8s API, so the token is pure attack surface. The one exception is a
  # service whose JOB is the k8s API (secrets-admin rewrites other services' Secret objects): it sets
  # this true in its own values file. Default false keeps every existing rendered manifest identical.
  automountToken: false

networkPolicy:
  enabled: true            # default-deny ingress AND egress; allows below are additive
  ingressFromNamespace: "" # e.g. "ingress" — where Traefik runs; empty = same namespace only
  # Narrowable peer allow-list (label selectors) — the network twin of the per-route internal caller
  # policy. EMPTY = any pod in the namespace may reach this service on its port, and this service may
  # reach any peer (today's behaviour, so upgrading changes nothing). Set each list to the peers a
  # service actually talks to and ONLY those labelled pods are allowed. Each item is a matchLabels
  # map, e.g. { app.kubernetes.io/name: billing-service }.
  peers:
    ingress: []            # who may CALL this service (empty = any pod in the namespace)
    egress: []             # which peers this service may call (empty = any pod in the namespace)
  egress:
    dns: true              # kube-dns; needed by almost everything
    datastore: true        # postgres/redis in this namespace
    # In-cluster object store (MinIO / on-prem S3), for services that read/write blobs
    # (file/backup/stream). Opens egress to pods labelled base-services/role=<roleLabel> on the
    # S3 API port — nothing else. This exists because egress is deny-by-default: a service
    # configured with OBJECTSTORE_DRIVER=s3 against an in-cluster endpoint is BLACKHOLED without
    # it (the pod comes up, /readyz hangs, no log names the cause). For an OUT-of-cluster / cloud
    # S3 endpoint, use `internet: true` instead — the app SSRF guard still applies.
    objectStore:
      enabled: false
      port: 9000
      roleLabel: objectstore   # matches `base-services/role` on the object-store pod
    # Outbound to the public internet. TRUE only for services that must call third parties
    # (webhook, connector, notification, billing, zatca). This is ALL-OR-NOTHING at the network
    # layer: it opens 80/443 to every public IP (RFC1918/link-local/metadata excluded). Narrowing
    # by HOST is application-layer only — the app's SSRF guard + EGRESS_ALLOWED_HOSTS — so do not
    # read `internet: true` as a per-host allow-list.
    internet: false
    # Escape hatch: additional egress rules declared VERBATIM by a values file, for anything the
    # toggles above do not cover (a second datastore, a sidecar, a licence server). Each item is a
    # standard NetworkPolicy egress peer — `{to: [...], ports: [...]}`. Empty by default: a service
    # reaches only what it declares. Example:
    #   extra:
    #     - to: [{ podSelector: { matchLabels: { app: clamav } } }]
    #       ports: [{ port: 3310, protocol: TCP }]
    extra: []
    # OPT-IN, CNI-SPECIFIC: real network-layer per-HOSTNAME egress. Stock k8s NetworkPolicy cannot
    # match egress by DNS name (only IP/CIDR), so `internet: true` above is all-or-nothing. When
    # enabled, this renders a Calico NetworkPolicy (projectcalico.org/v3) that allows egress ONLY to
    # `hosts` (plus DNS) — so drop `internet: true` and let this BE the allow-list. Requires Calico
    # with DNS policy (Felix DNSPolicyMode); ANY OTHER CNI IGNORES IT. Validate enforcement in your
    # cluster before relying on it — a policy the CNI does not enforce fails OPEN, silently.
    calicoFqdn:
      enabled: false
      hosts: []            # e.g. ["api.stripe.com", "graph.facebook.com"]

metrics:
  serviceMonitor: false    # scrapes /metrics cluster-internally (never via Ingress)
  interval: 30s

# ── Config & secrets ────────────────────────────────────────────────────────
# Non-secret Settings knobs. Every key MUST be a real field on that service's Settings:
# Kubernetes happily sets an env var nobody reads, so a typo deploys clean and is ignored.
env: {}

# Secrets are referenced, never inlined. Provide a Secret (sealed-secrets / ExternalSecret)
# holding INTERNAL_SERVICE_TOKEN, DATASTORE_DSN, CACHE_URL, TOKEN_* etc.
existingSecret: ""

# ── Scheduled maintenance ───────────────────────────────────────────────────
# Retention/prune endpoints exist in the services and have no caller without these.
# Each entry POSTs to an /internal path with the internal token.
#
# timeZone: the zone EVERY schedule below is interpreted in — a property of where the product
# is sold, not a per-tenant setting. Without it a CronJob is timed by whatever zone the node
# keeps, so a "09:00 Riyadh" digest fires at 04:00 on an Asia/Shanghai node. Defaults to the
# platform's home market (KSA); a deployment sold elsewhere overrides it, and an unknown zone is
# rejected at TEMPLATE time against the IANA list bundled in the chart. Set "" to deliberately
# accept the node's own zone (the pre-timeZone behaviour) — a choice on the record, not an accident.
# A single cronJob entry may carry its own `timeZone:` to override this default.
timeZone: "Asia/Riyadh"
cronJobs: []
#  - name: prune-raw
#    schedule: "17 3 * * *"
#    path: /internal/analytics/prune-raw
#    timeZone: "Asia/Riyadh"          # optional per-job override of the deployment default above

# ── Scheduling ──────────────────────────────────────────────────────────────
# Two "HA" replicas on the same node is not HA.
podAntiAffinity: soft      # soft | hard | off
topologySpread: true
nodeSelector: {}
tolerations: []
priorityClassName: ""

# Scheduling priority for generated CronJob pods. The PriorityClass OBJECTS are cluster-scoped and
# created once at bootstrap (deploy/k3s/priorityclasses.yaml), NOT here — each service is its own
# Helm release and a cluster object may have only one owner. This only REFERENCES the batch class:
# enabled, every CronJob pod is stamped with it, so under node contention the scheduler starves a
# seconds-lived cron pod before an always-on service. An always-on service opts into the CRITICAL
# class through `priorityClassName` above; the classes must exist on the cluster first.
priorityClasses:
  enabled: false
  batchClassName: base-services-batch   # must match the name in deploy/k3s/priorityclasses.yaml

podAnnotations: {}
podLabels: {}
