# =============================================================================
# Platform data stores — Postgres + Redis.
#
# The label `base-services/role: datastore` is LOAD-BEARING: the chart's egress
# NetworkPolicy allows traffic to pods carrying it and to nothing else. Remove the
# label and every service loses its database with a green rollout.
#
# Single-instance, local-path storage: correct for a single-node K3s. For real HA,
# swap in CloudNativePG / a managed Postgres and repoint DATASTORE_DSN — nothing in
# the chart changes, because the driver is config.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    base-services/role: datastore
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        base-services/role: datastore     # the chart's egress policy selects THIS
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          # Pinned by DIGEST, not by the moving 16.4-alpine tag — a tag is a name the registry can
          # repoint, so the next pull on a node reboot could silently deliver a different image with
          # nothing in this manifest changing. Every base-services workload is digest-pinned; these
          # datastores were the exception. The tag is kept for legibility; the digest is what pulls.
          image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
          # TLS in transit. Every service->DB hop is otherwise cleartext on the pod network, and the
          # one service holding real PII (operations) sends phone numbers over it on every search —
          # which defeats the pseudonymisation posture the moment anything gets a foothold on the
          # network. ssl=on with a self-signed cert closes PASSIVE interception (sslmode=require):
          # it encrypts without proving identity. verify-full (a trust chain) is a larger, deferred
          # conversation for a single-node cluster, so the cert stays self-signed — no CA needed.
          #
          # ORDER IS LOAD-BEARING: this server half MUST ship before gen-secrets.py appends
          # sslmode=require to any DSN. A DSN that demands TLS from a server that does not offer it
          # makes every service refuse its connection and fail at boot — the whole platform down from
          # one word. So the server offers TLS first (encrypt-if-asked); the client half comes later.
          args:
            - postgres
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/etc/postgres-tls/tls.crt
            - -c
            - ssl_key_file=/etc/postgres-tls/tls.key
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: platform-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: platform-secrets, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              value: base_services
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: tls
              mountPath: /etc/postgres-tls
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: tls
          secret:
            secretName: postgres-tls
            # Postgres REFUSES a key readable by group/world UNLESS it is owned by root — and a
            # Secret volume's files are owned by root:fsGroup. 0640 is the one mode that both lets
            # postgres (uid 999, in fsGroup 999) read the key AND passes its permission check.
            defaultMode: 0640
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    base-services/role: datastore
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        base-services/role: datastore     # ...and THIS
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          # Digest-pinned like postgres above — the 7.4-alpine tag stays for legibility, the digest pulls.
          image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
          ports:
            - containerPort: 6379
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
