openapi: 3.1.0
info:
  title: stream-service — live camera / RTSP ingest, control, record, view
  version: 0.6.0
  description: |
    Turns a live source (RTSP/ONVIF camera, RTMP, HTTP) into what a user needs: a live view
    (HLS + WebRTC), snapshots/thumbnails, recordings (stored in file-service), motion events, and PTZ.

    ## Two planes
    - **Control plane** (this API): register sources, start/stop sessions, PTZ, list recordings. Low QPS.
    - **Media plane**: the video bytes NEVER traverse this API. Live playback is a **signed, short-lived
      URL** (HLS playlist / WebRTC endpoint) the stream engine serves; recordings are file-service
      objects. The API only ever returns a *handle*, never a frame.

    ## The one guarantee
    A session can never run forever. Every session resolves auto-stop **guards** (max_duration,
    idle_timeout, max_size, schedule, lease) enforced by the process owner, plus per-tenant **quotas**.
    A sweeper reaps anything orphaned or over-limit. This is the answer to "the user forgot to stop it".

    ## Security
    - The source URL is untrusted input: SSRF-guarded (allowlist + private/metadata block, IP-pinned per
      reconnect); credentials are sealed at rest and redacted from every response, log, event, and playlist.
    - Playback is gated by a signed, tenant+session-scoped token; the media origin verifies it.
    - Everything is tenant-scoped from the JWT; cross-tenant access is 404 (hidden), never 403.

    All mutations require `stream.manage`; reads require `stream.view`; `platform.stream` grants both
    cross-tenant (operator).

servers:
  - url: /
    description: The api-gateway origin.

security:
  - bearerAuth: []

tags:
  - name: sources
  - name: sessions
  - name: playback
  - name: recordings
  - name: ptz
  - name: triggers
  - name: health

paths:
  # ── Sources ────────────────────────────────────────────────────────────────
  /api/v1/sources:
    get:
      operationId: listSources
      tags: [sources]
      summary: List registered sources (tenant-scoped; url redacted to host).
      parameters:
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/after" }
      responses:
        "200":
          description: A page of sources.
          content:
            application/json:
              schema:
                type: object
                required: [sources, next]
                properties:
                  sources: { type: array, items: { $ref: "#/components/schemas/Source" } }
                  next: { type: [string, "null"] }
    post:
      operationId: registerSource
      tags: [sources]
      summary: Register a source. Validates the URL (SSRF) and seals credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceIn" }
      responses:
        "201": { description: Registered., content: { application/json: { schema: { $ref: "#/components/schemas/Source" } } } }
        "400": { description: Invalid URL / blocked by SSRF policy. }

  /api/v1/sources/{source_id}:
    parameters: [{ $ref: "#/components/parameters/sourceId" }]
    get:
      operationId: getSource
      tags: [sources]
      responses:
        "200": { description: The source., content: { application/json: { schema: { $ref: "#/components/schemas/Source" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateSource
      tags: [sources]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SourceIn" } } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/Source" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteSource
      tags: [sources]
      parameters:
        - { name: force, in: query, schema: { type: boolean, default: false }, description: Stop live sessions first. }
      responses:
        "200": { description: Deleted (recordings are retained and detached). }
        "409": { description: A session is live and force was not set. }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sources/{source_id}/probe:
    parameters: [{ $ref: "#/components/parameters/sourceId" }]
    post:
      operationId: probeSource
      tags: [sources]
      summary: Open briefly and report codec/resolution/fps/audio/PTZ, without starting a session.
      responses:
        "200": { description: Probe result., content: { application/json: { schema: { $ref: "#/components/schemas/Probe" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { description: The source could not be opened. }

  /api/v1/sources/{source_id}/snapshot:
    parameters: [{ $ref: "#/components/parameters/sourceId" }]
    post:
      operationId: sourceSnapshot
      tags: [sources]
      summary: Grab one frame without a full session (open, grab, close).
      responses:
        "200": { description: A snapshot handle., content: { application/json: { schema: { $ref: "#/components/schemas/Snapshot" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sources/{source_id}/health:
    parameters: [{ $ref: "#/components/parameters/sourceId" }]
    get:
      operationId: sourceHealth
      tags: [health]
      responses:
        "200": { description: Health., content: { application/json: { schema: { $ref: "#/components/schemas/SourceHealth" } } } }

  # ── Sessions ───────────────────────────────────────────────────────────────
  /api/v1/sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      parameters:
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/after" }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/SessionStatus" } }
      responses:
        "200":
          description: A page of sessions.
          content:
            application/json:
              schema:
                type: object
                required: [sessions, next]
                properties:
                  sessions: { type: array, items: { $ref: "#/components/schemas/Session" } }
                  next: { type: [string, "null"] }
    post:
      operationId: startSession
      tags: [sessions]
      summary: Start a live session; returns the session plus playback handles.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SessionIn" } } } }
      responses:
        "201": { description: Started., content: { application/json: { schema: { $ref: "#/components/schemas/SessionStarted" } } } }
        "429": { description: Quota exceeded (concurrency/hours). , content: { application/json: { schema: { $ref: "#/components/schemas/QuotaError" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sessions/{session_id}:
    parameters: [{ $ref: "#/components/parameters/sessionId" }]
    get:
      operationId: getSession
      tags: [sessions]
      responses:
        "200": { description: The session., content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: killSession
      tags: [sessions]
      summary: Force-stop and clean up.
      responses:
        "200": { description: Stopped., content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sessions/{session_id}/stop:
    parameters: [{ $ref: "#/components/parameters/sessionId" }]
    post:
      operationId: stopSession
      tags: [sessions]
      summary: Graceful stop (reason=user).
      responses:
        "200": { description: Stopping., content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sessions/{session_id}/guards:
    parameters: [{ $ref: "#/components/parameters/sessionId" }]
    patch:
      operationId: tightenGuards
      tags: [sessions]
      summary: Tighten a running session's auto-stop guards (never loosen past the service max).
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Guards" } } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Playback ───────────────────────────────────────────────────────────────
  /api/v1/sessions/{session_id}/playback:
    parameters: [{ $ref: "#/components/parameters/sessionId" }]
    get:
      operationId: getPlayback
      tags: [playback]
      summary: Re-issue fresh signed playback handles (HLS/WebRTC/snapshot). Refreshing keeps a viewer "active".
      responses:
        "200": { description: Handles., content: { application/json: { schema: { $ref: "#/components/schemas/Playback" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sessions/{session_id}/snapshot:
    parameters: [{ $ref: "#/components/parameters/sessionId" }]
    get:
      operationId: sessionSnapshot
      tags: [playback]
      summary: A live snapshot handle (rate-limited by SNAPSHOT_MIN_INTERVAL).
      responses:
        "200": { description: Snapshot., content: { application/json: { schema: { $ref: "#/components/schemas/Snapshot" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sessions/{session_id}/webrtc/offer:
    parameters: [{ $ref: "#/components/parameters/sessionId" }]
    post:
      operationId: webrtcOffer
      tags: [playback]
      summary: WHEP-style WebRTC — SDP offer in, SDP answer out. Each answered offer counts as a viewer.
      requestBody:
        required: true
        content:
          application/sdp: { schema: { type: string } }
      responses:
        "200": { description: SDP answer., content: { application/sdp: { schema: { type: string } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: WebRTC disabled or no egress available. }

  # ── PTZ ────────────────────────────────────────────────────────────────────
  /api/v1/sources/{source_id}/ptz/move:
    parameters: [{ $ref: "#/components/parameters/sourceId" }]
    post:
      operationId: ptzMove
      tags: [ptz]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PtzMove" } } } }
      responses:
        "200": { description: Moving. }
        "409": { description: PTZ unsupported by this source. }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/sources/{source_id}/ptz/stop:
    parameters: [{ $ref: "#/components/parameters/sourceId" }]
    post: { operationId: ptzStop, tags: [ptz], responses: { "200": { description: Stopped. } } }
  /api/v1/sources/{source_id}/ptz/presets:
    parameters: [{ $ref: "#/components/parameters/sourceId" }]
    get: { operationId: listPresets, tags: [ptz], responses: { "200": { description: Presets., content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PtzPreset" } } } } } } }
    post: { operationId: createPreset, tags: [ptz], responses: { "201": { description: Created. } } }
  /api/v1/sources/{source_id}/ptz/goto/{preset_token}:
    parameters:
      - { $ref: "#/components/parameters/sourceId" }
      - { name: preset_token, in: path, required: true, schema: { type: string } }
    post: { operationId: gotoPreset, tags: [ptz], responses: { "200": { description: Moving to preset. } } }

  # ── Triggers ───────────────────────────────────────────────────────────────
  /api/v1/sources/{source_id}/triggers:
    parameters: [{ $ref: "#/components/parameters/sourceId" }]
    get: { operationId: getTriggers, tags: [triggers], responses: { "200": { description: Triggers., content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Trigger" } } } } } } }
    put:
      operationId: setTriggers
      tags: [triggers]
      requestBody: { required: true, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Trigger" } } } } }
      responses: { "200": { description: Saved. } }

  # ── Recordings & exports ───────────────────────────────────────────────────
  /api/v1/recordings:
    get:
      operationId: listRecordings
      tags: [recordings]
      parameters:
        - { name: source_id, in: query, schema: { type: string } }
        - { name: start, in: query, schema: { type: string, format: date-time } }
        - { name: end, in: query, schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/after" }
      responses:
        "200":
          description: A page of recordings.
          content:
            application/json:
              schema:
                type: object
                required: [recordings, next]
                properties:
                  recordings: { type: array, items: { $ref: "#/components/schemas/Recording" } }
                  next: { type: [string, "null"] }
  /api/v1/recordings/{recording_id}:
    parameters: [{ name: recording_id, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getRecording
      tags: [recordings]
      responses:
        "200": { description: The recording., content: { application/json: { schema: { $ref: "#/components/schemas/Recording" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteRecording
      tags: [recordings]
      responses:
        "200": { description: Deleted. }
        "409": { description: Recording is locked (legal hold). }
  /api/v1/recordings/{recording_id}/lock:
    parameters: [{ name: recording_id, in: path, required: true, schema: { type: string } }]
    post: { operationId: lockRecording, tags: [recordings], summary: Legal hold — exempt from retention., responses: { "200": { description: Locked. } } }
  /api/v1/recordings/{recording_id}/unlock:
    parameters: [{ name: recording_id, in: path, required: true, schema: { type: string } }]
    post: { operationId: unlockRecording, tags: [recordings], responses: { "200": { description: Unlocked. } } }

  /api/v1/recordings/export:
    post:
      operationId: exportClip
      tags: [recordings]
      summary: Extract a time range across segments into one downloadable object (async).
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ExportIn" } } } }
      responses:
        "202": { description: Export queued., content: { application/json: { schema: { $ref: "#/components/schemas/Export" } } } }
        "400": { description: Range exceeds EXPORT_MAX_RANGE_SECONDS. }
  /api/v1/exports/{export_id}:
    parameters: [{ name: export_id, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getExport
      tags: [recordings]
      responses:
        "200": { description: Export status (file_id when ready)., content: { application/json: { schema: { $ref: "#/components/schemas/Export" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    after: { name: after, in: query, schema: { type: string, maxLength: 512 }, description: Opaque keyset cursor. }
    sourceId: { name: source_id, in: path, required: true, schema: { type: string } }
    sessionId: { name: session_id, in: path, required: true, schema: { type: string } }

  responses:
    NotFound:
      description: Not found (also returned to hide a resource in another tenant).
      content: { application/json: { schema: { type: object, properties: { error: { type: string } } } } }

  schemas:
    SourceIn:
      type: object
      required: [name, url]
      properties:
        name: { type: string, maxLength: 200 }
        url:
          type: string
          description: rtsp://…, rtmp://…, or http(s)://…m3u8. May embed credentials; sealed server-side.
        transport: { type: string, enum: [tcp, udp, auto], default: tcp }
        kind: { type: string, enum: [rtsp, onvif, rtmp, http] }
        onvif:
          type: object
          properties: { host: { type: string }, port: { type: integer }, profile_token: { type: string } }
        tags: { type: array, items: { type: string } }
        group_id: { type: string }
        enabled: { type: boolean, default: true }
        default_profile: { type: string }
    Source:
      allOf:
        - $ref: "#/components/schemas/SourceIn"
        - type: object
          required: [id, tenant, created]
          properties:
            id: { type: string }
            tenant: { type: string }
            url: { type: string, description: REDACTED to scheme://host (never credentials). }
            created: { type: string, format: date-time }
            updated: { type: string, format: date-time }
    Probe:
      type: object
      properties:
        codec: { type: string }
        width: { type: integer }
        height: { type: integer }
        fps: { type: number }
        has_audio: { type: boolean }
        ptz_capable: { type: boolean }
    SourceHealth:
      type: object
      properties:
        reachable: { type: boolean }
        last_frame_at: { type: [string, "null"], format: date-time }
        fps: { type: number }
        bitrate: { type: integer }
        reconnects: { type: integer }
        circuit: { type: string, enum: [closed, open, half_open] }
        state: { type: string, enum: [online, offline, unknown] }

    SessionMode: { type: string, enum: [on_demand, viewer_driven, continuous, scheduled] }
    SessionStatus: { type: string, enum: [starting, live, reconnecting, stopping, stopped, error] }
    OutputKind: { type: string, enum: [hls, webrtc, snapshot, thumbnail, record] }
    Guards:
      type: object
      description: 0 or omitted = use the service default; values above the service hard-max are clamped.
      properties:
        max_duration_s: { type: integer, minimum: 0 }
        idle_timeout_s: { type: integer, minimum: 0 }
        max_size_bytes: { type: integer, minimum: 0 }
        schedule:
          type: object
          properties: { cron: { type: string }, tz: { type: string }, duration_s: { type: integer } }
    SessionIn:
      type: object
      required: [source_id]
      properties:
        source_id: { type: string }
        mode: { $ref: "#/components/schemas/SessionMode" }
        outputs: { type: array, items: { $ref: "#/components/schemas/OutputKind" } }
        profile: { type: string }
        guards: { $ref: "#/components/schemas/Guards" }
    Session:
      type: object
      required: [id, tenant, source_id, mode, status, outputs]
      properties:
        id: { type: string }
        tenant: { type: string }
        source_id: { type: string }
        mode: { $ref: "#/components/schemas/SessionMode" }
        status: { $ref: "#/components/schemas/SessionStatus" }
        outputs: { type: array, items: { $ref: "#/components/schemas/OutputKind" } }
        profile: { type: string }
        guards: { $ref: "#/components/schemas/Guards" }
        viewers: { type: integer }
        stats:
          type: object
          properties:
            bytes_out: { type: integer }
            duration_s: { type: integer }
            fps: { type: number }
            bitrate: { type: integer }
            reconnects: { type: integer }
            last_frame_at: { type: [string, "null"], format: date-time }
        reason: { type: string, enum: ["", user, max_duration, idle, max_size, schedule, error, quota] }
        created: { type: string, format: date-time }
        updated: { type: string, format: date-time }
    SessionStarted:
      type: object
      properties:
        session: { $ref: "#/components/schemas/Session" }
        playback: { $ref: "#/components/schemas/Playback" }
    Playback:
      type: object
      description: Signed, short-lived handles. The media bytes never come from this API.
      properties:
        hls:
          type: object
          properties: { playlist_url: { type: string }, segment_seconds: { type: integer }, low_latency: { type: boolean } }
        webrtc:
          type: object
          properties: { offer_url: { type: string }, ice_servers: { type: array, items: { type: object } } }
        snapshot_url: { type: string }
        expires_at: { type: string, format: date-time }
    Snapshot:
      type: object
      properties:
        url: { type: string }
        taken_at: { type: string, format: date-time }
        width: { type: integer }
        height: { type: integer }
    QuotaError:
      type: object
      properties:
        error: { type: string, const: quota }
        dimension: { type: string, enum: [concurrency, hours, storage] }

    PtzMove:
      type: object
      properties:
        pan: { type: number, minimum: -1, maximum: 1 }
        tilt: { type: number, minimum: -1, maximum: 1 }
        zoom: { type: number, minimum: -1, maximum: 1 }
        mode: { type: string, enum: [continuous, relative, absolute], default: continuous }
    PtzPreset:
      type: object
      properties: { token: { type: string }, name: { type: string } }

    Trigger:
      type: object
      required: [on, do]
      properties:
        on: { type: string, enum: [motion, online, offline] }
        do: { type: array, items: { type: string, enum: [record, snapshot, webhook, notify] } }
        debounce_s: { type: integer, default: 30 }
        targets: { type: object, description: e.g. webhook endpoint id / notification template. }

    Recording:
      type: object
      properties:
        id: { type: string }
        tenant: { type: string }
        source_id: { type: string }
        session_id: { type: string }
        started: { type: string, format: date-time }
        ended: { type: [string, "null"], format: date-time }
        trigger: { type: string, enum: [continuous, motion, manual] }
        locked: { type: boolean }
        total_bytes: { type: integer }
        segments:
          type: array
          items:
            type: object
            properties:
              file_id: { type: string, description: a file-service object id (bytes live there). }
              start: { type: string, format: date-time }
              end: { type: string, format: date-time }
              bytes: { type: integer }
    ExportIn:
      type: object
      required: [source_id, start, end]
      properties:
        source_id: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        format: { type: string, enum: [mp4, fmp4, mkv], default: mp4 }
    Export:
      type: object
      properties:
        id: { type: string }
        source_id: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        status: { type: string, enum: [pending, ready, failed] }
        file_id: { type: [string, "null"], description: a file-service object id when ready. }
