openapi: 3.1.0
info:
  title: End-User App — Catalog API
  version: 0.6.1
  description: |
    One call powers the end-user app: `GET /api/v1/app/catalog`. It returns every self-service action
    the CALLING user may perform, grouped by service, across every service in the gateway's
    `ADMIN_SERVICES` config (the same service list that feeds the admin panel). It is the user-facing
    twin of `GET /api/v1/admin/catalog`:

    | | admin panel | end-user app |
    |---|---|---|
    | endpoint | `/api/v1/admin/catalog` | `/api/v1/app/catalog` |
    | reads | each service's `admin_actions` | each service's `user_actions` |
    | who | operators (needs `ADMIN_CATALOG_CAP` to open) | any authenticated user (no open-cap) |
    | scope | operator/platform routes | the user's OWN self-service routes |

    The panel is a MAP, never the AUTHORITY. The catalog tells a front end what to render; every action
    is still re-authorized AND re-scoped to the caller's own tenant/identity at its own route when
    invoked. Same anti-SSRF and capability-filtering rules as the admin panel: discovery is config
    (never a request), a service's declaration is untrusted input (method allow-listed, path forced
    relative), the internal token stays server-side, and the result is filtered to the caller's caps.

    ## How a front end uses it
    Identical to the admin panel (see `admin-panel-guide.md`): `GET /api/v1/app/catalog` with the
    user's JWT, render each `services[].actions[]` (using `group`, `params`, `confirm`/`danger`), and
    invoke `{method} {path}` on the same gateway origin. The action shape is
    `docs/contracts/user-actions.schema.json` — the SAME shape as `admin-actions.schema.json`.

servers:
  - url: /
    description: The api-gateway origin (same origin the browser app is served behind).

paths:
  /api/v1/app/catalog:
    get:
      operationId: getAppCatalog
      summary: Every self-service action the calling user may perform, grouped by service.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The filtered catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"
        "401":
          description: No/invalid user token. (There is NO extra open-capability — any authenticated user may fetch their own app.)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The user's own JWT, carrying their capabilities.

  schemas:
    Catalog:
      type: object
      required: [services, unreachable]
      properties:
        services:
          type: array
          items: { $ref: "#/components/schemas/ServiceBlock" }
        unreachable:
          type: array
          description: Names of configured services that did not answer — render as degraded.
          items: { type: string }
    ServiceBlock:
      type: object
      required: [service, actions]
      properties:
        service: { type: string, description: The service name from ADMIN_SERVICES (e.g. "file-service"). }
        actions:
          type: array
          items: { $ref: "#/components/schemas/Action" }
    Action:
      type: object
      description: Same shape as an admin action — see docs/contracts/user-actions.schema.json.
      required: [id, label, method, path, capability, confirm, danger]
      properties:
        id: { type: string, description: 'Stable action id, e.g. "files.upload".' }
        label: { type: string, description: Human label; the renderer MUST escape it. }
        method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] }
        path:
          type: string
          description: RELATIVE path to call on the gateway origin, e.g. "/api/v1/files/{id}". Never a scheme/host.
        capability:
          type: string
          description: The capability the route re-checks. The caller already holds it (the catalog is filtered).
        group: { type: string, description: Optional UI section, e.g. "Files". }
        confirm: { type: boolean, description: Show a confirmation step. True whenever danger is true. }
        danger: { type: boolean, description: Destructive/irreversible for the user — style prominently. }
        params:
          type: array
          items: { $ref: "#/components/schemas/Param" }
    Param:
      type: object
      required: [name]
      properties:
        name: { type: string }
        in: { type: string, enum: [path, query, body] }
        type: { type: string, enum: [string, integer, number, boolean, enum, object] }
        required: { type: boolean }
        enum: { type: array, items: { type: string } }
        help: { type: string }
